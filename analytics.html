<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналітика доходів і витрат (Деталізація)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 font-sans leading-normal tracking-normal p-4">

    <!-- Навігація -->
    <nav class="bg-white shadow p-4 mb-6 rounded-lg max-w-7xl mx-auto flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-slate-800">Аналітика доходів і витрат (Історія + Прогноз)</h1>
            <p class="text-xs text-slate-500 mt-0.5">Звітна дата зрізу: <span id="headerReportDate" class="font-semibold text-indigo-600">24.08.2026</span></p>
        </div>
        <div>
            <a href="index.html" class="text-blue-600 hover:underline mr-4">Головна</a>
            <a href="analytics.html" class="text-gray-800 font-semibold">Аналітика</a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Панель фільтрації та керування графіком -->
        <div class="bg-white p-4 rounded-lg shadow flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-4 items-center">
                <!-- Фільтр доходів -->
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-600 uppercase">Доходи:</label>
                    <select id="inflowMode" onchange="onInflowModeChange()" class="border border-slate-300 rounded px-2 py-1 text-xs bg-slate-50">
                        <option value="all">Всі статті</option>
                        <option value="custom">Обрані статті</option>
                    </select>
                </div>
                <!-- Мультиселект для доходів -->
                <div id="inflowCustomContainer" class="hidden flex items-center gap-1 bg-slate-50 p-1 border rounded text-xs">
                    <label><input type="checkbox" value="Нафта" checked onchange="updateChartAndTable()"> Нафта</label>
                    <label><input type="checkbox" value="Газ природній" checked onchange="updateChartAndTable()"> Газ</label>
                    <label><input type="checkbox" value="Нафтопродукти ОПТ" checked onchange="updateChartAndTable()"> ОПТ</label>
                    <label><input type="checkbox" value="Нафтопродукти АОЗ" checked onchange="updateChartAndTable()"> АОЗ</label>
                    <label><input type="checkbox" value="Нафтопродукти роздріб АЗС" checked onchange="updateChartAndTable()"> АЗС</label>
                </div>
            </div>

            <div class="flex flex-wrap gap-4 items-center">
                <!-- Фільтр витрат -->
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-600 uppercase">Видатки:</label>
                    <select id="outflowMode" onchange="onOutflowModeChange()" class="border border-slate-300 rounded px-2 py-1 text-xs bg-slate-50">
                        <option value="all">Всі статті</option>
                        <option value="custom">Обрані статті</option>
                    </select>
                </div>
                <!-- Мультиселект для видатків -->
                <div id="outflowCustomContainer" class="hidden flex items-center gap-1 bg-slate-50 p-1 border rounded text-xs">
                    <label><input type="checkbox" value="Комерційний оборотний капітал" checked onchange="updateChartAndTable()"> Оборотний капітал</label>
                    <label><input type="checkbox" value="Обов’язкові платежі" checked onchange="updateChartAndTable()"> Обов'язкові платежі</label>
                </div>
            </div>
        </div>

        <!-- Блок з графіком -->
        <div class="bg-white p-6 rounded-lg shadow">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-700">Динаміка (4 тижні тому + 12 тижнів вперед, млн грн)</h2>
                <span id="dataStatus" class="text-xs font-medium px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800">Дані готові</span>
            </div>
            <div class="relative h-96">
                <canvas id="cashFlowTrendChart"></canvas>
            </div>
        </div>

        <!-- Таблиця деталізації -->
        <div class="bg-white p-6 rounded-lg shadow overflow-x-auto">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">Деталізована таблиця бюджету</h2>
            <table class="min-w-full divide-y divide-gray-200 text-xs" id="dynamicTable">
                <thead>
                    <tr class="bg-gray-50 text-gray-500 uppercase" id="tableHeadRow">
                        <th class="px-3 py-2 text-left font-medium">Показник / Стаття</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200" id="tableBodyRows">
                    <!-- Заповнюється динамічно -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let trendChart = null;

        // Шкала часу: 4 тижні тому (Т-4...Т-1), поточний (Т0), 12 тижнів прогнозу (Т1...Т12)
        const labels = ["Т-4", "Т-3", "Т-2", "Т-1", "Т0", "Т1", "Т2", "Т3", "Т4", "Т5", "Т6", "Т7", "Т8", "Т9", "Т10", "Т11", "Т12"];

        // Структура даних з деталізацією (в млн грн)
        const rawData = {
            inflows: {
                "Нафта": [40, 42, 45, 46, 2069, 919, 904, 0, 0, 588, 86, 615, 124, 272, 718, 0, 391],
                "Газ природній": [0, 0, 0, 42, 751, 240, 240, 240, 168, 0, 250, 250, 250, 250, 250, 250, 250],
                "Нафтопродукти ОПТ": [1700, 1750, 1800, 1814, 1894, 1801, 1622, 1622, 1622, 1622, 1562, 1562, 1562, 1562, 1571, 1571, 1571],
                "Нафтопродукти АОЗ": [500, 520, 600, 703, 504, 938, 938, 938, 938, 938, 908, 908, 908, 908, 1502, 1502, 1502],
                "Нафтопродукти роздріб АЗС": [1000, 1020, 1030, 1037, 1098, 1098, 1046, 1046, 1046, 1046, 998, 998, 998, 998, 998, 998, 998]
            },
            outflows: {
                "Комерційний оборотний капітал": [2100, 2200, 2150, 2160, 5338, 2382, 1308, 3846, 2365, 2840, 2155, 3274, 3737, 1838, 3779, 2572, 3198],
                "Обов’язкові платежі": [2000, 2050, 2080, 2096, 174, 1539, 665, 107, 544, 1586, 674, 68, 494, 1625, 796, 84, 1516]
            }
        };

        function formatNum(val) {
            if (val == null || isNaN(val)) return '-';
            return Number(val).toLocaleString('uk-UA', { maximumFractionDigits: 0 }).replace(/\u202F/g, ' ');
        }

        function sumArrays(arrays) {
            if (!arrays.length) return Array(labels.length).fill(0);
            return arrays[0].map((_, colIdx) => arrays.reduce((sum, arr) => sum + (arr[colIdx] || 0), 0));
        }

        function onInflowModeChange() {
            const mode = document.getElementById('inflowMode').value;
            document.getElementById('inflowCustomContainer').classList.toggle('hidden', mode === 'all');
            updateChartAndTable();
        }

        function onOutflowModeChange() {
            const mode = document.getElementById('outflowMode').value;
            document.getElementById('outflowCustomContainer').classList.toggle('hidden', mode === 'all');
            updateChartAndTable();
        }

        function getSelectedSubItems(type) {
            const mode = document.getElementById(type + 'Mode').value;
            const container = document.getElementById(type + 'CustomContainer');
            const checkboxes = container.querySelectorAll('input[type="checkbox"]');
            
            let selected = [];
            checkboxes.forEach(cb => {
                if (mode === 'all' || cb.checked) {
                    selected.push(cb.value);
                }
            });
            return selected;
        }

        function updateChartAndTable() {
            const selectedInflows = getSelectedSubItems('inflow');
            const selectedOutflows = getSelectedSubItems('outflow');

            // Розрахунок масивів для ліній суми
            const totalInflowArr = sumArrays(Object.values(rawData.inflows));
            const totalOutflowArr = sumArrays(Object.values(rawData.outflows));

            // Розрахунок масивів для обраних підпунктів
            const customInflowArr = sumArrays(selectedInflows.map(k => rawData.inflows[k]));
            const customOutflowArr = sumArrays(selectedOutflows.map(k => rawData.outflows[k]));

            // Оновлення графіка
            updateChart(totalInflowArr, totalOutflowArr, customInflowArr, customOutflowArr, selectedInflows, selectedOutflows);
            
            // Оновлення таблиці
            updateTable(selectedInflows, selectedOutflows, totalInflowArr, totalOutflowArr);
        }

        function updateChart(totalInf, totalOut, customInf, customOut, selInfKeys, selOutKeys) {
            const ctx = document.getElementById('cashFlowTrendChart').getContext('2d');
            if (trendChart) trendChart.destroy();

            const datasets = [
                {
                    label: 'Загальні Доходи (Всього)',
                    data: totalInf,
                    borderColor: '#059669',
                    backgroundColor: 'rgba(5, 150, 105, 0.1)',
                    borderWidth: 3,
                    type: 'line',
                    order: 1
                },
                {
                    label: 'Загальні Видатки (Всього)',
                    data: totalOut,
                    borderColor: '#DC2626',
                    backgroundColor: 'rgba(220, 38, 38, 0.1)',
                    borderWidth: 3,
                    type: 'line',
                    order: 2
                }
            ];

            // Якщо увімкнено деталізацію обраних статей, додаємо стовпчики
            if (document.getElementById('inflowMode').value === 'custom' && selInfKeys.length > 0) {
                datasets.push({
                    label: 'Обрані Доходи (сума)',
                    data: customInf,
                    backgroundColor: 'rgba(16, 185, 129, 0.6)',
                    type: 'bar',
                    order: 3
                });
            }
            if (document.getElementById('outflowMode').value === 'custom' && selOutKeys.length > 0) {
                datasets.push({
                    label: 'Обрані Видатки (сума)',
                    data: customOut,
                    backgroundColor: 'rgba(239, 68, 68, 0.6)',
                    type: 'bar',
                    order: 4
                });
            }

            trendChart = new Chart(ctx, {
                data: { labels: labels, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } },
                    plugins: { legend: { position: 'top' } }
                }
            });
        }

        function updateTable(selInfKeys, selOutKeys, totalInf, totalOut) {
            const headRow = document.getElementById('tableHeadRow');
            headRow.innerHTML = '<th class="px-3 py-2 text-left font-medium">Показник / Стаття</th>' + labels.map(l => `<th class="px-2 py-2 text-right">${l}</th>`).join('');

            let html = '';

            // Блок Доходи
            html += `<tr class="bg-emerald-100 font-bold text-emerald-900"><td class="px-3 py-2">ДОХОДИ (ВСЬОГО)</td>${totalInf.map(v => `<td class="px-2 py-2 text-right">${formatNum(v)}</td>`).join('')}</tr>`;
            Object.keys(rawData.inflows).forEach(k => {
                const isSel = selInfKeys.includes(k);
                html += `<tr class="${isSel ? 'bg-emerald-50/50' : 'opacity-50'}">
                    <td class="px-3 py-2 pl-6 text-slate-700">↳ ${k}</td>
                    ${rawData.inflows[k].map(v => `<td class="px-2 py-2 text-right text-slate-600">${formatNum(v)}</td>`).join('')}
                </tr>`;
            });

            // Блок Видатки
            html += `<tr class="bg-red-100 font-bold text-red-900 border-t-2"><td class="px-3 py-2">ВИДАТКИ (ВСЬОГО)</td>${totalOut.map(v => `<td class="px-2 py-2 text-right">${formatNum(v)}</td>`).join('')}</tr>`;
            Object.keys(rawData.outflows).forEach(k => {
                const isSel = selOutKeys.includes(k);
                html += `<tr class="${isSel ? 'bg-red-50/50' : 'opacity-50'}">
                    <td class="px-3 py-2 pl-6 text-slate-700">↳ ${k}</td>
                    ${rawData.outflows[k].map(v => `<td class="px-2 py-2 text-right text-slate-600">${formatNum(v)}</td>`).join('')}
                </tr>`;
            });

            // Чистий потік
            const netFlow = totalInf.map((inf, idx) => inf - totalOut[idx]);
            html += `<tr class="bg-slate-200 font-bold text-slate-900 border-t-2">
                <td class="px-3 py-2">ЧИСТИЙ ГРОШОВИЙ ПОТІК (Net Cash Flow)</td>
                ${netFlow.map(v => `<td class="px-2 py-2 text-right ${v >= 0 ? 'text-emerald-700' : 'text-red-700'}">${formatNum(v)}</td>`).join('')}
            </tr>`;

            document.getElementById('tableBodyRows').innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', updateChartAndTable);
    </script>
</body>
</html>
