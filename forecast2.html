    <style>
        * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

        .executive-container {
            width: 1587px; min-height: 900px; margin: 0 auto; background-color: #fff;
            padding: 20px 26px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,.1);
            display: flex; flex-direction: column; gap: 10px;
        }
        .card { background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }

        .an-wrap { overflow: auto; max-height: 780px; }
        .an-table { width: 100%; border-collapse: collapse; font-size: 9pt; font-variant-numeric: tabular-nums; }
        .an-table th { font-size: 8.5pt; color: #475569; font-weight: 600; padding: 5px 5px; border-bottom: 1.5px solid #94a3b8;
                       text-align: right; background: #f8fafc; white-space: nowrap; position: sticky; top: 0; z-index: 2; }

        .an-table th.nm-col { z-index: 3; background: #f8fafc; }
        .an-table th .th-period { display: block; font-size: 7pt; font-weight: 500; color: #94a3b8; line-height: 1.15; margin-top: 1px; }
        .an-table td { padding: 3px 5px; text-align: right; color: #334155; border-bottom: 1px solid #eef2f6; white-space: nowrap; }

        tr.lvl-block td { background: #e0e7ff; font-weight: 700; color: #312e81; }
        tr.lvl-item  td { font-weight: 700; color: #1e293b; background: #f8fafc; }

        tr.row-key   td { background: #dbeafe !important; color: #1e3a8a; font-weight: 700; border-top: 1px solid #93c5fd; border-bottom: 1px solid #93c5fd; }

        #printRoot { display: none; }
        #printMeasure { position: absolute; left: -30000px; top: 0; visibility: hidden; }
        .print-page { position: relative; overflow: hidden; background: #fff; }
        .print-scale { transform-origin: top left; }
        .print-table { table-layout: fixed !important; }
        .print-title { font-weight: 700; color: #0f172a; margin-bottom: 6px; }
        .print-title .sub { font-weight: 400; color: #475569; }

        .print-table { width: auto !important; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 8.5pt; }
        .print-table th, .print-table td { position: static !important; white-space: nowrap; }
        .print-table th.nm-col, .print-table td.nm-col { min-width: 0 !important; max-width: 520px; white-space: normal; }

                         transform-origin: top center; transition: transform .15s ease-out; }

        @page { size: A3 landscape; margin: 8mm; }
        @media print {

    <script>
    // 1. КОНФІГУРАЦІЯ
    const GET_METRICS_FLOW_URL = "https://defaultce629f5605df43c6b9798b0b7992fc.55.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/28/workflows/76596625557146c6882e837e2fb46961/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=mWBVsXd5FLyjoME7JGEBX1Zo4zfdQKt1Fi46spXVdFU";
    
    const CONFIG = {
        FLOW_URL: GET_METRICS_FLOW_URL,
        DICT_FLOW_URL: GET_METRICS_FLOW_URL
    };

    window.DYNAMIC_CF_DICT = null;
    window.CF_DICT_ARRAY = [];
    window.REV_ON = false;

    let SNAP = null, NODES = [], TREE = null, expanded = {}, UNIT = 'ths';
    let monthOpen = { M1: true, M2: false, M3: false };
    const DAY = 86400000;
    const isoOf = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    const mondayOf = d => { const x = new Date(d); x.setHours(12, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return isoOf(x); };
    const isoShift = (iso, days) => isoOf(new Date(Date.parse(iso + 'T12:00:00') + days * DAY));

    let currentReportDate = mondayOf(new Date());
    let calViewDate = new Date(currentReportDate + 'T12:00:00');
    const availableDates = new Set();

    const dmy = iso => String(iso || '').split('-').reverse().join('.');
    const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const sp = s => s.replace(/[\u202F\u00A0]/g, ' ');

    function setViewMode(mode) {
        const a3 = mode === 'a3';
        document.body.classList.toggle('view-a3', a3);
        document.body.classList.toggle('view-fluid', !a3);
        document.getElementById('btnViewA3').classList.toggle('active', a3);
        document.getElementById('btnViewFluid').classList.toggle('active', !a3);
    }

    const PX_PER_MM = 96 / 25.4;
    const PAGE = { w: 420, h: 297, margin: 8 };
    const MAX_PAGES = 2;
    const MIN_SCALE = 0.35;
    const ROW_SLACK = 1.06;
    const ZOOM_OK = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('zoom', '2');
    const pageW = () => (PAGE.w - 2 * PAGE.margin) * PX_PER_MM;
    const pageH = () => (PAGE.h - 2 * PAGE.margin) * PX_PER_MM;

    function printTitleHtml() {
        const g = id => document.getElementById(id).textContent;
        const created = g('hdrCreated');
        return `<div class="print-title" style="font-size:13pt">
            ПРОГНОЗ РУХУ КОШТІВ АТ «УКРНАФТА» 13 тижнів станом на ${esc(g('hdrCur'))}
            <div class="sub" style="font-size:8.5pt;margin-top:2px">Горизонт прогнозу: ${esc(g('hdrRange'))} · ${esc(g('hdrUnit'))}${created && created !== '--' ? ' · ' + esc(created) : ''}</div>
        </div>`;
    }

    function measureTable() {
        const src = document.querySelector('#pane table');
        if (!src) return null;
        const holder = document.getElementById('printMeasure');
        holder.innerHTML = '';
        const title = document.createElement('div');
        title.innerHTML = printTitleHtml();
        const clone = src.cloneNode(true);
        clone.className = 'an-table print-table';
        holder.appendChild(title);
        holder.appendChild(clone);

        const natW = Math.max(clone.scrollWidth || 0, clone.offsetWidth || 0, 1);
        const headCells = clone.tHead ? Array.from(clone.tHead.rows[0].cells) : [];
        const colW = headCells.map(c => c.offsetWidth || 0);
        const titleH = title.offsetHeight || 40;
        const headH = clone.tHead ? (clone.tHead.offsetHeight || 24) : 0;
        const rows = clone.tBodies[0] ? Array.from(clone.tBodies[0].rows) : [];
        const rowH = rows.map(r => r.offsetHeight || 14);
        const theadHtml = clone.tHead ? clone.tHead.outerHTML : '';
        const rowsHtml = rows.map(r => r.outerHTML);
        holder.innerHTML = '';
        return { natW, colW, titleH, headH, rowH, theadHtml, rowsHtml, totalRowsH: rowH.reduce((a, b) => a + b, 0) };
    }

    function buildPrintPages() {
        const root = document.getElementById('printRoot');
        root.innerHTML = '';
        const m = measureTable();
        if (!m || !m.rowsHtml.length) return { pages: 0, scale: 1, natW: 0 };

        const W = pageW(), H = pageH();
        const scaleW = W / m.natW;
        const neededH = m.titleH + MAX_PAGES * m.headH + m.totalRowsH;
        const scaleH = (MAX_PAGES * H) / neededH;

        const paginate = sc => {
            const capacity = H / sc;
            const pages = [];
            let cur = [], used = m.titleH + m.headH;
            m.rowH.forEach((h, i) => {
                const hh = h * ROW_SLACK;
                if (cur.length && used + hh > capacity) { pages.push(cur); cur = []; used = m.headH; }
                cur.push(i); used += hh;
            });
            if (cur.length) pages.push(cur);
            return pages;
        };

        let scale = Math.max(MIN_SCALE, Math.min(scaleW, scaleH, 1));
        let pagesRows = paginate(scale);
        while (pagesRows.length > MAX_PAGES && scale > MIN_SCALE) {
            scale = Math.max(MIN_SCALE, scale * 0.97);
            pagesRows = paginate(scale);
        }

        const targetW = W / scale;
        const colSum = (m.colW || []).reduce((a, b) => a + b, 0);
        const factor = colSum > 0 ? targetW / colSum : 1;
        const widths = (m.colW && m.colW.length ? m.colW : []).map(w => Math.max(1, w * factor));
        const colgroup = widths.length
            ? '<colgroup>' + widths.map(w => '<col style="width:' + w.toFixed(2) + 'px">').join('') + '</colgroup>'
            : '';

        pagesRows.forEach((idxs, p) => {
            const page = document.createElement('div');
            page.className = 'print-page';
            page.style.width = W + 'px';
            page.style.height = H + 'px';
            const inner = document.createElement('div');
            inner.className = 'print-scale';
            inner.style.width = targetW + 'px';
            if (ZOOM_OK) inner.style.zoom = scale;
            else { inner.style.transform = 'scale(' + scale + ')'; inner.style.transformOrigin = 'top left'; }
            inner.innerHTML = (p === 0 ? printTitleHtml() : '') +
                '<table class="an-table print-table" style="width:' + targetW.toFixed(2) + 'px">' +
                colgroup + m.theadHtml +
                '<tbody>' + idxs.map(i => m.rowsHtml[i]).join('') + '</tbody></table>';
            page.appendChild(inner);
            root.appendChild(page);
        });
        return { pages: pagesRows.length, scale, natW: m.natW };
    }

    function b64json(obj){
        if (obj && typeof obj['$content'] === 'string'){
            try {
                return JSON.parse(new TextDecoder('utf-8')
                    .decode(Uint8Array.from(atob(obj['$content']), c => c.charCodeAt(0))));
            } catch(e){ return null; }
        }
        return null;
    }

    function extractSnapshotObject(obj, depth = 0) {
        if (!obj || typeof obj !== 'object' || depth > 8) return null;
        if (obj.tree && obj.meta) return obj;
        
        const dec = b64json(obj);
        if (dec) { const r = extractSnapshotObject(dec, depth + 1); if (r) return r; }

        const cand = [obj.snapshot, obj.content, obj.body, obj.value, obj.data, obj.result, obj.json];
        for (const c of cand) {
            if (!c) continue;
            if (typeof c === 'string') { try { const r = extractSnapshotObject(JSON.parse(c), depth + 1); if (r) return r; } catch (e) {} continue; }
            const r = extractSnapshotObject(c, depth + 1);
            if (r) return r;
        }
        if (Array.isArray(obj)) for (const it of obj) { const r = extractSnapshotObject(it, depth + 1); if (r) return r; }
        return null;
    }

    // 2. УТИЛІТИ ДЛЯ ПОБУДОВИ ДЕРЕВА
    const NORM_KEYS = ['T0','T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'];
    const nvals = r => NORM_KEYS.map(k => (r.values && r.values[k]) || 0);
    const nNonZero = v => v.some(x => Math.abs(x) >= 1);
    const nSame = (a, b) => a.every((v, i) => Math.abs(v - b[i]) < 1);
    const nAdd = (a, b) => a.map((v, i) => v + b[i]);
    const clean = s => String(s == null ? '' : s).replace(/\s+/g, ' ').replace(/[’']/g, "'").trim();
    const SUMMARY_RE = /^(Всього|КОНТРОЛЬ|Контроль|Грошовий потік|Чистий грошовий|Доступн|Залишки|Заборгован|Різниця|Надходження \(|Видатки \(|\*Інформаційно|Придбання МЗНН)/;

    const LEVEL_HINTS = {
        'Податки': 1, 'Державні податки': 2, 'Рентна плата': 3, 'Інші податки': 2, 'Місцеві податки': 3,
        'Заробітна плата': 1, 'Енергія': 1, "Інші обов'язкові операційні платежі": 1
    };
    const DROP_ROWS = [/^КОНТРОЛЬ витрат по напрямках/i];
    const LAST_ROW_RE = /^\*?\s*Інформаційно: придбання НП/i;

    function groupBySums(list) {
        const n = list.length, memo = new Array(n).fill(null);
        const node = i => {
            if (memo[i]) return memo[i];
            const r = list[i].row, own = nvals(r);
            let out = { item: list[i], kids: [], next: i + 1 };
            memo[i] = out;
            if (nNonZero(own)) {
                let k = i + 1, kids = [], cum = NORM_KEYS.map(() => 0);
                while (k < n) {
                    const c = node(k);
                    if (kids.length && c.kids.length && (c.item.row.kind === 'total' || c.item.row.kind === 'subgroup')) break;
                    kids.push(c); cum = nAdd(cum, nvals(c.item.row)); k = c.next;
                    const enough = kids.length >= 2 || r.kind === 'total' || r.kind === 'subgroup';
                    if (enough && nSame(cum, own)) {
                        while (k < n && !nNonZero(nvals(list[k].row))) { const z = node(k); kids.push(z); k = z.next; }
                        out = { item: list[i], kids, next: k }; memo[i] = out; break;
                    }
                }
            }
            return out;
        };
        const top = []; let i = 0;
        while (i < n) { const c = node(i); top.push(c); i = c.next; }
        return top;
    }

    function groupByHints(list) {
        const top = [], stack = [];
        const close = () => stack.pop();
        list.forEach(entry => {
            const r = entry.row, name = clean(r.name);
            const hint = LEVEL_HINTS[name];
            const nd = { item: entry, kids: [], cum: NORM_KEYS.map(() => 0), own: nvals(r) };
            if (hint) { while (stack.length && stack[stack.length - 1].lvl >= hint) close(); }
            const par = stack.length ? stack[stack.length - 1] : null;
            (par ? par.node.kids : top).push(nd);
            if (par) {
                let p = stack.length - 1;
                while (p >= 0) {
                    stack[p].node.cum = nAdd(stack[p].node.cum, nvals(r));
                    if (nNonZero(stack[p].node.own) && nSame(stack[p].node.cum, stack[p].node.own)) { stack.length = p; break; }
                    p--;
                }
            }
            const isGroup = r.kind === 'total' || r.kind === 'subgroup' || hint;
            if (isGroup) stack.push({ lvl: hint || ((stack.length ? stack[stack.length - 1].lvl : 0) + 1), node: nd });
        });
        return top;
    }

    function buildTree(rows) {
        let dropping = false;
        const lastIdx = rows.findIndex(r => LAST_ROW_RE.test(clean(r.name)));
        const usable = rows.filter((r, i) => {
            if (lastIdx >= 0 && i > lastIdx) return false;
            if (r.kind === 'block') dropping = false;
            if (DROP_ROWS.some(re => re.test(clean(r.name)))) { dropping = true; return false; }
            if (dropping) return false;
            return !!clean(r.name);
        });
        const mk = r => ({ row: r, children: [], pending: [] });
        const roots = []; let stack = [], block = null, pend = null;
        usable.forEach(r => {
            const no = String(r.no == null ? '' : r.no).trim();
            const nd = mk(r);
            if (r.kind === 'block') { roots.push(nd); block = nd; stack = [{ lvl: 0, nd }]; pend = nd; }
            else if (r.kind === 'item' && no) {
                const lvl = 1 + Math.max(0, no.split('.').length - 1);
                while (stack.length && stack[stack.length - 1].lvl >= lvl) stack.pop();
                const par = stack.length ? stack[stack.length - 1].nd : null;
                (par ? par.pending : roots).push(nd);
                stack.push({ lvl, nd }); pend = nd;
            } else if (r.kind === 'total' && !r.code && !no && SUMMARY_RE.test(clean(r.name)) && block) {
                while (stack.length > 1) stack.pop();
                block.pending.push(nd); pend = block;
            } else (pend ? pend.pending : roots).push(nd);
        });
        const finalize = nd => {
            if (nd.pending.length) {
                const hinted = nd.pending.some(p => LEVEL_HINTS[clean(p.row.name)]);
                const grouped = hinted ? groupByHints(nd.pending) : groupBySums(nd.pending);
                const conv = g => { const c = g.item; finalize(c); c.children = g.kids.map(conv).concat(c.children); return c; };
                nd.children = grouped.map(conv).concat(nd.children);
            }
            nd.pending = [];
        };
        roots.forEach(finalize);
        const toPlain = nd => Object.assign({}, nd.row, { children: nd.children.map(toPlain) });
        return roots.map(toPlain).filter(n => n.kind !== 'block' || (n.children && n.children.length));
    }

    function indexTree(tree) {
        const list = [];
        const walk = (nodes, parentId, depth, prefix) => {
            (nodes || []).forEach((n, i) => {
                const id = prefix + '/' + i;
                const rec = { id, parentId, depth, node: n, name: n.name || '', kind: n.kind || '',
                              no: n.no, code: n.code, src_row: n.src_row, keep: n.keep, childIds: [] };
                list.push(rec);
                if (parentId != null) { const p = list.find(x => x.id === parentId); if (p) p.childIds.push(id); }
                if (n.children && n.children.length) walk(n.children, id, depth + 1, id);
            });
        };
        walk(tree, null, 0, '');
        return list;
    }
    const byId = id => NODES.find(n => n.id === id);

    // 3. ЗАВАНТАЖЕННЯ ТА ІНІЦІАЛІЗАЦІЯ
    function applySnapshot(envelope, requestedIso) {
        const snap = extractSnapshotObject(envelope);
        if (!snap) throw new Error('у відповіді немає снапшоту (meta + tree)');
        SNAP = snap;
        TREE = buildTree(snap.rows || []);
        NODES = indexTree(TREE);
        resetDefaultExpanded();
        document.getElementById('expandAll').checked = false;
        const m = snap.meta || {};
        const iso = m.forecast_date || requestedIso || '';
        if (iso) { currentReportDate = iso; availableDates.add(iso); }
        document.getElementById('navCurDate').textContent = iso ? dmy(iso) : '--';
        document.getElementById('hdrCur').textContent = iso ? dmy(iso) : '--';
        document.getElementById('lblSelectedDate').textContent = iso ? dmy(iso) : 'Обрати дату';
        document.getElementById('hdrCreated').textContent = m.created_utc
            ? 'створено: ' + String(m.created_utc).replace('T', ' ').slice(0, 19) + ' UTC' : '';
        const c = snap.columns || {};
        document.getElementById('hdrRange').textContent =
            ((c.T0 && c.T0.date_range) || '') + ' – ' + ((c.T12 && c.T12.date_range) || '');
        
        render();
    }

    async function loadDictionary() {
        if (!CONFIG.DICT_FLOW_URL) return;
        try {
            const res = await fetch(CONFIG.DICT_FLOW_URL, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ dictionaryOnly: true })
            });
            const data = await res.json();
            const dictArray = data.cfDictionary || data.dictionary;
            if (Array.isArray(dictArray) && dictArray.length > 0) {
                window.DYNAMIC_CF_DICT = {}; 
                window.CF_DICT_ARRAY = dictArray;
                dictArray.forEach(d => {
                    const k = (d.MatchKey || d.Title || '').trim();
                    if (k && String(d.IsActive == null ? 'Так' : d.IsActive) !== 'Ні') {
                        window.DYNAMIC_CF_DICT[k] = [d.RK_Item || '', d.MapStatus || (d.RK_Item ? 'OK' : 'БЕЗ МАПІНГУ'), d.ERPName || ''];
                    }
                });
            }
        } catch(e) { console.warn("Помилка завантаження довідника", e); }
    }

    async function fetchSnapshot(iso) {
        const res = await fetch(CONFIG.FLOW_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reportDate: iso, reportDateDot: dmy(iso), includeDictionary: true })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        
        const dictArray = data.cfDictionary || data.dictionary;
        if (Array.isArray(dictArray) && dictArray.length > 0) {
            window.DYNAMIC_CF_DICT = {};
            window.CF_DICT_ARRAY = dictArray;
            dictArray.forEach(d => {
                const k = (d.MatchKey || d.Title || '').trim();
                if (k && String(d.IsActive == null ? 'Так' : d.IsActive) !== 'Ні') {
                    window.DYNAMIC_CF_DICT[k] = [d.RK_Item || '', d.MapStatus || (d.RK_Item ? 'OK' : 'БЕЗ МАПІНГУ'), d.ERPName || ''];
                }
            });
        }
        return data;
    }

    async function loadLatestMonday(weeksBack) {
        let iso = mondayOf(new Date());
        const limit = weeksBack || 8;
        setStatus('Пошук останнього зрізу…', 'bg-indigo-100 text-indigo-800');

    function loadLocalFile(input) {
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            try { applySnapshot(JSON.parse(reader.result), null); setStatus('Зріз ' + dmy(currentReportDate), 'bg-emerald-100 text-emerald-800'); }

    }

    // 4. ТАБЛИЦЯ, КОЛОНКИ ТА ФОРМАТУВАННЯ
    const MONTHS = [
        { key: 'M1', weeks: ['T0', 'T1', 'T2', 'T3'] },
        { key: 'M2', weeks: ['T4', 'T5', 'T6', 'T7'] },
        { key: 'M3', weeks: ['T8', 'T9', 'T10', 'T11', 'T12'] }
    ];
    const PREV_KEYS = ['Tm1_plan', 'Tm1_forecast', 'dev_forecast', 'Tm1_fact', 'dev_fact'];
    const MONTH_KEYS = MONTHS.map(m => m.key);
    const DEV_KEYS = ['dev_forecast', 'dev_fact'];

    function activeColumns() {
        const cols = SNAP.columns || {}, keys = [];
        PREV_KEYS.forEach(k => {
            const box = document.getElementById('col' + k);
            if (box && box.checked && cols[k]) keys.push(k);
        });
        MONTHS.forEach(m => {
            if (monthOpen[m.key]) m.weeks.forEach(w => cols[w] && keys.push(w));
            if (cols[m.key]) keys.push(m.key);
        });
        if (document.getElementById('grpTotal').checked && cols.TT0_12) keys.push('TT0_12');
        return keys;
    }

    function setUnit(u) {
        UNIT = u;
        document.getElementById('unitThs').className = 'ctl' + (u === 'ths' ? ' active' : '');
        document.getElementById('unitMln').className = 'ctl' + (u === 'mln' ? ' active' : '');
        document.getElementById('hdrUnit').textContent = u === 'ths' ? 'тис. грн' : 'млн грн';
        render();
    }
    const unitDiv = () => (UNIT === 'ths' ? 1e3 : 1e6);

    function fmtCell(v) {
        if (v == null || isNaN(v)) return { txt: '', cls: 'zero' };
        const r = Math.round(v / unitDiv());
        if (r === 0) return { txt: '0', cls: 'zero' };
        return { txt: (r < 0 ? '−' : '') + sp(Math.abs(r).toLocaleString('uk-UA')), cls: r < 0 ? 'neg' : '' };
    }

    function toggleMonth(k) { monthOpen[k] = !monthOpen[k]; render(); }
    function resetDefaultExpanded() {
        expanded = {};
        if (Array.isArray(TREE)) TREE.forEach((n, i) => { expanded['/' + i] = true; });
    }
    function toggleExpandAll(checked) { if (!checked) resetDefaultExpanded(); render(); }
    function toggleNode(id) {
        const box = document.getElementById('expandAll');
        if (box.checked) { box.checked = false; NODES.forEach(n => { expanded[n.id] = true; }); }
        expanded[id] = !isExpanded(id);
        render();
    }
    const isExpanded = id => (document.getElementById('expandAll').checked ? true : !!expanded[id]);

    const KEY_ROWS = [/^Всього витрат/i, /^Всього видатків/i, /^Всього надходжень/i, /^Грошовий потік/i, /^Чистий грошовий потік/i];
    const BLUE_ROWS = [/^Доступні залишки/i, /^Залишки доступні до використання/i];
    const COVER_ROWS = [/^Повернення покриття/i, /^Розміщення покриття постімпорт/i, /^Оплата по постімпорту/i, /^постімпорт$/i];
    const isKeyRow = n => KEY_ROWS.some(re => re.test(clean(n.name)));
    const isCoverRow = n => COVER_ROWS.some(re => re.test(clean(n.name)));
    const isBlueRow = n => BLUE_ROWS.some(re => re.test(clean(n.name)));

    function matches(rec) {
        const q = clean(document.getElementById('searchBox').value).toLowerCase();
        if (!q) return true;
        return [rec.name, rec.code, rec.no].some(v => String(v == null ? '' : v).toLowerCase().includes(q));
    }
    const allZero = rec => !nNonZero(nvals(rec.node)) && !rec.childIds.some(id => nNonZero(nvals(byId(id).node)));

    function visibleRows() {
        const onlyKeep = document.getElementById('onlyKeep').checked;
        const hideZero = document.getElementById('hideZero').checked;
        const q = clean(document.getElementById('searchBox').value);
        const hits = new Set();
        if (q) NODES.filter(matches).forEach(r => { let c = r; while (c) { hits.add(c.id); c = c.parentId ? byId(c.parentId) : null; } });
        const out = [];
        const walk = ids => ids.forEach(id => {
            const rec = byId(id);
            if (!rec) return;
            if (onlyKeep && rec.keep === false) return;
            if (hideZero && allZero(rec)) return;
            if (q && !hits.has(id)) return;
            out.push(rec);
            if (rec.childIds.length && (q ? true : isExpanded(id))) walk(rec.childIds);
        });
        walk(NODES.filter(n => n.parentId === null).map(n => n.id));
        return out;
    }

    function formatColumnLabel(k, label) {
        if (k === 'dev_fact') return 'Відхилення,<br><span style="font-weight:500">+/− (факт − план)</span>';
        if (k === 'dev_forecast') return 'Відхилення,<br><span style="font-weight:500">+/− (прогноз − план)</span>';
        return esc(label);
    }

    function render() {
        const pane = document.getElementById('pane');
        if (!SNAP) { pane.innerHTML = '<div class="text-xs text-slate-400 p-3">Дані ще не завантажені. Оберіть дату зрізу або відкрийте локальний файл.</div>'; return; }
        
        if (window.REV_ON) {
            renderReverse();
            return;
        }

        const cols = SNAP.columns || {}, keys = activeColumns();

        const head = `<tr><th class="nm-col">Стаття</th>${keys.map(k => {
            const c = cols[k] || {};
            const isMon = MONTH_KEYS.indexOf(k) >= 0;
            const cls = k === 'TT0_12' ? 'col-sum' : isMon ? 'col-mon'
                      : DEV_KEYS.indexOf(k) >= 0 ? 'col-prev col-dev' : (PREV_KEYS.indexOf(k) >= 0 ? 'col-prev' : '');
            const label = formatColumnLabel(k, (c.label || k).replace(/\s+/g, ' ').trim());
            const toggle = isMon
                ? `<span class="mon-toggle" title="${monthOpen[k] ? 'Згорнути тижні місяця' : 'Показати тижні місяця'}" onclick="toggleMonth('${k}')">${monthOpen[k] ? '−' : '+'}</span>`
                : '';
            const main = c.date_range ? esc(c.date_range) : label;
            const sub = c.date_range ? `<span class="th-period">${label}</span>` : '';
            return `<th class="${cls}">${main}${toggle}${sub}</th>`;
        }).join('')}</tr>`;

        const recs = visibleRows();
        const body = recs.map(rec => {
            const n = rec.node, hasKids = rec.childIds.length > 0, open = isExpanded(rec.id);
            const toggle = hasKids
                ? `<span class="toggle-kids" onclick="event.stopPropagation(); toggleNode('${esc(rec.id)}')">${open ? '−' : '+'}</span>`
                : '<span class="toggle-placeholder"></span>';
            const lvl = rec.kind === 'block' ? 'lvl-block'
                      : rec.kind === 'item' ? 'lvl-item'
                      : (rec.kind === 'total' || rec.kind === 'subgroup') ? 'lvl-sub' : 'lvl-leaf';
            const extra = (isKeyRow(n) ? ' row-key' : '') + (isCoverRow(n) ? ' row-cover' : '') + (isBlueRow(n) ? ' row-blue' : '');
            const codeTxt = String(n.no == null ? '' : n.no).trim();
            const cells = keys.map(k => {
                const c = fmtCell((n.values || {})[k]);
                const isMon = MONTH_KEYS.indexOf(k) >= 0;
                const isDev = DEV_KEYS.indexOf(k) >= 0;
                const base = k === 'TT0_12' ? 'col-sum ' : isMon ? 'col-mon '
                           : isDev ? 'col-prev col-dev ' : (PREV_KEYS.indexOf(k) >= 0 ? 'col-prev ' : '');
                const cls = base + c.cls + (isDev && c.cls === '' ? ' pos' : '');
                return `<td class="${cls}">${c.txt}</td>`;
            }).join('');
            return `<tr class="${lvl}${extra}" onclick="${hasKids ? `toggleNode('${esc(rec.id)}')` : ''}">
                <td class="nm-col" style="padding-left:${6 + rec.depth * 16}px">${toggle}${codeTxt ? `<span class="an-code">${esc(codeTxt)}</span>` : ''}<span class="nm-txt">${esc(n.name)}</span></td>
                ${cells}</tr>`;
        }).join('');

        pane.innerHTML = keys.length
            ? `<table class="an-table"><thead>${head}</thead><tbody>${body}</tbody></table>`
            : '<div class="text-xs text-slate-400 p-3">Оберіть хоча б одну групу колонок.</div>';

        if (window.__rkMap && window.__rkMap.decorate) window.__rkMap.decorate();
    }

    function renderCalendar() {
        const NAMES = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];

    // 7. СИСТЕМА ПІДСВІЧУВАННЯ МАПІНГУ (DECORATE)
    function nodeHasValues(n) {
        var v = (n && n.values) || {}, k;
        for (k in v) if (typeof v[k] === 'number' && v[k] !== 0) return true;
        return false;
    }

    function isLeaf(n) {
        var kids = (n && n.children) || [];
        if (!kids.length) return true;
        for (var i = 0; i < kids.length; i++) {
            if (nodeHasValues(kids[i]) || ((kids[i].children || []).length)) return false;
        }
        return true;
    }

    function cutoff() {
        var rows = (SNAP && SNAP.rows) || [];
        var min = Infinity;
        for (var i = 0; i < rows.length; i++) {
            var r = rows[i];
            if (r && r.src_row && String(r.name || '').indexOf('Залишки на кінець періоду') === 0) {
                if (r.src_row < min) min = r.src_row;
            }
        }
        return min;
    }

    function classify(rec, cut) {
        var n = (rec && rec.node) || {};
        var code = String(n.code == null ? '' : n.code).trim();
        if (!code) return null;
        if (n.kind !== 'child' && n.kind !== 'item') return null;
        if (n.src_row && n.src_row >= cut) return null;
        if (String(n.name || '').indexOf('КОНТРОЛЬ витрат по напрямках') === 0) return null;
        if (!isLeaf(n)) return { kind: 'parent', code: code };

        var d = (window.DYNAMIC_CF_DICT || window.CF_DICT_FALLBACK)[code];
        if (!d) return { kind: 'missing', code: code };
        if (!d[0]) return { kind: 'nomap', code: code, status: d[1] };
        return { kind: 'ok', code: code, rk: d[0], status: d[1] };
    }

    function tagHtml(c) {
        if (c.kind === 'ok') {
            var sug = c.status === 'ПРОПОЗИЦІЯ';
            return '<span class="map-tag ' + (sug ? 'map-sug' : 'map-ok') + '" title="Стаття РК-презентації 11-25' +
                   (sug ? ' (пропозиція — потребує підтвердження)' : '') + '">' + esc(c.rk) + (sug ? ' ?' : '') + '</span>';
        }
        if (c.kind === 'nomap') {
            return '<span class="map-tag map-none" title="Ключ ' + esc(c.code) +
                   ' є в довіднику CF_Dictionary, але статтю РК-презентації йому не призначено">немає мапінгу</span>';
        }
        if (c.kind === 'missing') {
            return '<span class="map-tag map-miss" title="Ключа ' + esc(c.code) +
                   ' немає в довіднику CF_Dictionary — його треба додати">немає в довіднику</span>';
        }
        return '';
    }

    window.__rkMap = {
        decorate: function() {
            if (window.REV_ON) return;
            var showBox = document.getElementById('mapShow');
            if (!showBox) return;
            var stats = document.getElementById('mapStats');

            var trs = document.querySelectorAll('#pane table tbody tr');
            var recs = visibleRows();
            if (!trs.length || !recs || recs.length !== trs.length) {
                if (stats) stats.textContent = '';
                return;
            }

            var cut = cutoff();
            var show = showBox.checked;
            var gapsBox = document.getElementById('mapOnlyGaps');
            var onlyGaps = gapsBox && gapsBox.checked;
            var ok = 0, nomap = 0, missing = 0;

            for (var i = 0; i < trs.length; i++) {
                var tr = trs[i];
                tr.classList.remove('map-unmapped');
                tr.style.removeProperty('display');

                var old = tr.querySelector('.map-tag');
                if (old) old.remove();

                var c = classify(recs[i], cut);
                if (c) {
                    if (c.kind === 'ok') ok++;
                    else if (c.kind === 'nomap') nomap++;
                    else if (c.kind === 'missing') missing++;
                }

                var isGap = !!(c && (c.kind === 'nomap' || c.kind === 'missing'));
                if (onlyGaps && !isGap) { tr.style.display = 'none'; continue; }
                if (!show || !c) continue;

                var cell = tr.querySelector('td.nm-col') || tr.cells[0];
                var html = tagHtml(c);
                if (cell && html) cell.insertAdjacentHTML('beforeend', html);
                if (isGap) tr.classList.add('map-unmapped');
            }

            if (stats) {
                var tot = ok + nomap + missing;
                stats.textContent = tot
                    ? 'змаплено ' + ok + ' з ' + tot +
                      (nomap ? ' · без статті РК ' + nomap : '') +
                      (missing ? ' · немає в довіднику ' + missing : '')
                    : '';
                stats.className = 'map-legend' + ((nomap + missing) ? ' text-amber-700 font-semibold' : '');
            }
        }
    };
