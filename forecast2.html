  /* ── Класифікація одного вузла дерева ──────────────────────────────────── */
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
    .replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function nodeHasValues(n) {
    const v = (n && n.values) || {};
    return Object.keys(v).some(k => typeof v[k] === 'number' && v[k] !== 0);
  }
  /* лист виміру: без дітей, або діти порожні, а значення є у батька */
  function isLeaf(n) {
    const kids = (n && n.children) || [];
    if (!kids.length) return true;
    return !kids.some(k => nodeHasValues(k) || ((k.children || []).length));
  }

  /* Інформаційна частина аркуша (доступні ліміти, заборгованість, контроль)
     лежить нижче рядка «Залишки на кінець періоду» — це залишки, а не потоки,
     тож у мапінгу вони не беруть участі й лейблів не отримують. */
  let CUT = null;
  function cutoff() {
    if (CUT !== null) return CUT;
    const rows = (typeof SNAP === 'object' && SNAP && SNAP.rows) || [];
    const m = rows.filter(r => String(r.name || '').startsWith('Залишки на кінець періоду') && r.src_row)
                  .map(r => r.src_row);
    return (CUT = m.length ? Math.min.apply(null, m) : Infinity);
  }

  function classify(rec) {
    const n = rec.node || {};
    const code = String(n.code == null ? '' : n.code).trim();
    if (!code) return null;                       // підсумки й технічні рядки не мапляться
    if (n.kind !== 'child' && n.kind !== 'item') return null;
    if (n.src_row && n.src_row >= cutoff()) return null;
    if (String(n.name || '').indexOf('КОНТРОЛЬ витрат по напрямках') === 0) return null;
    if (!isLeaf(n)) return { kind: 'parent', code };   // розшифровується дочірніми рядками

    const d = CF_DICT[code];
    if (!d) return { kind: 'missing', code };
    const [rk, status] = d;
    if (!rk) return { kind: 'nomap', code, status };
    return { kind: 'ok', code, rk, status };

    nomap:   c => `<span class="map-tag map-none" title="Ключ ${esc(c.code)} є в довіднику CF_Dictionary, ` +
                  `але статтю РК-презентації йому не призначено">немає мапінгу</span>`,
    missing: c => `<span class="map-tag map-miss" title="Ключа ${esc(c.code)} немає в довіднику CF_Dictionary — ` +
                  `його треба додати">немає в довіднику</span>`,
    parent:  () => ''
  };

  /* ── Панель керування ──────────────────────────────────────────────────── */
  function injectControls() {
    const bar = document.querySelector('.bg-slate-50.p-2\\.5');
    if (!bar || document.getElementById('mapShow')) return;
    const wrap = document.createElement('span');
    wrap.className = 'flex items-center gap-3 border-l pl-4 border-slate-200';
    wrap.innerHTML =
      '<span class="text-xs text-slate-600">РК-мапінг:</span>' +
      '<label class="flex items-center gap-1.5 text-xs text-slate-700 cursor-pointer">' +
        '<input type="checkbox" id="mapShow" checked> показувати</label>' +
      '<label class="flex items-center gap-1.5 text-xs text-slate-700 cursor-pointer" ' +
        'title="Залишає лише статті, яким не призначено статтю РК-презентації або яких немає в довіднику">' +
        '<input type="checkbox" id="mapOnlyGaps"> лише без мапінгу</label>' +
      '<span class="map-legend" id="mapStats"></span>';
    bar.appendChild(wrap);
    document.getElementById('mapShow').addEventListener('change', () => render());
    document.getElementById('mapOnlyGaps').addEventListener('change', () => render());
  }

  /* ── Нанесення лейблів на вже відрендерену таблицю ─────────────────────── */
  function decorate() {
    const showBox = document.getElementById('mapShow');
    const gapsBox = document.getElementById('mapOnlyGaps');
    const stats = document.getElementById('mapStats');
    if (!showBox || typeof visibleRows !== 'function') return;

    const trs = document.querySelectorAll('#pane table tbody tr');
    if (!trs.length) { if (stats) stats.textContent = ''; return; }

    const recs = visibleRows();
    const show = showBox.checked, onlyGaps = gapsBox.checked;
    let ok = 0, nomap = 0, missing = 0;

    trs.forEach((tr, i) => {
      const rec = recs[i];
      tr.classList.remove('map-unmapped');
      tr.style.removeProperty('display');
      if (!rec) return;

      const c = classify(rec);
      if (c) {
        if (c.kind === 'ok') ok++;
        else if (c.kind === 'nomap') nomap++;
        else if (c.kind === 'missing') missing++;
      }

      const cell = tr.querySelector('td.nm-col');
      if (!cell) return;
      const old = cell.querySelector('.map-tag');
      if (old) old.remove();

      const isGap = c && (c.kind === 'nomap' || c.kind === 'missing');
      if (onlyGaps && !isGap) { tr.style.display = 'none'; return; }
      if (!show || !c || !TAGS[c.kind]) return;

      const html = TAGS[c.kind](c);
      if (html) cell.insertAdjacentHTML('beforeend', html);
      if (isGap) tr.classList.add('map-unmapped');
    });

    if (stats) {
      const tot = ok + nomap + missing;
      stats.textContent = tot
        ? `змаплено ${ok} з ${tot}` + (nomap ? ` · без статті РК ${nomap}` : '') +
          (missing ? ` · немає в довіднику ${missing}` : '')
        : '';
      stats.className = 'map-legend' + ((nomap + missing) ? ' text-amber-700 font-semibold' : '');
    }
  }

  /* ── Обгортаємо наявний render() ───────────────────────────────────────── */
  function hook() {
    if (typeof render !== 'function') return false;
    if (render.__mapPatched) return true;
    const orig = render;
    const patched = function () {
      const r = orig.apply(this, arguments);
      try { decorate(); } catch (e) { console.warn('РК-мапінг:', e); }
      return r;
    };
    patched.__mapPatched = true;
    window.render = patched;
    try { render = patched; } catch (e) { /* якщо біндинг незмінний — вистачить window */ }
    return true;
  }

  function boot() {
    injectControls();
    if (hook() && document.querySelector('#pane table')) render();
  }

  if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', boot);
  else boot();
  /* дані вантажаться асинхронно — підстраховка на перший рендер після fetch */
  setTimeout(boot, 1500);
  setTimeout(boot, 5000);
})();
</script>
