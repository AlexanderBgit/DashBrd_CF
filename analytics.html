<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Динаміка ліквідності (13 тижнів)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 font-sans leading-normal tracking-normal p-4">

    <!-- Навігація -->
    <nav class="bg-white shadow p-4 mb-6 rounded-lg max-w-7xl mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold text-slate-800">F13: Динаміка ліквідності (Історія 4 тижні + Прогноз 12 тижнів)</h1>
        <div>
            <a href="index.html" class="text-blue-600 hover:underline mr-4">Головна</a>
            <a href="analytics.html" class="text-gray-800 font-semibold">Аналітика</a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Блок з графіком -->
        <div class="bg-white p-6 rounded-lg shadow">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-700" id="chartTitle">Доступна ліквідність та залишки (млн грн)</h2>
                <span id="dataStatus" class="text-xs font-medium px-2.5 py-1 rounded-full bg-amber-100 text-amber-800">Завантаження з хмари...</span>
            </div>
            <div class="relative h-96">
                <canvas id="liquidityTrendChart"></canvas>
            </div>
        </div>

        <!-- Таблиця зрізу по періодах -->
        <div class="bg-white p-6 rounded-lg shadow overflow-x-auto">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">Деталізація по періодах (млн грн)</h2>
            <table class="min-w-full divide-y divide-gray-200 text-sm">
                <thead>
                    <tr class="bg-gray-50" id="tableHeader">
                        <th class="px-4 py-3 text-left font-medium text-gray-500 uppercase">Показник</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200" id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const GET_METRICS_FLOW_URL = "https://defaultce629f5605df43c6b9798b0b7992fc.55.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/28/workflows/76596625557146c6882e837e2fb46961/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=mWBVsXd5FLyjoME7JGEBX1Zo4zfdQKt1Fi46spXVdFU";

        let trendChart = null;

        function formatNum(val) {
            if (val == null || isNaN(val)) return '-';
            return Number(val).toLocaleString('uk-UA', { maximumFractionDigits: 0 }).replace(/\u202F/g, ' ');
        }

        function renderChart(labels, liquidityData, cashData) {
            const ctx = document.getElementById('liquidityTrendChart').getContext('2d');
            if (trendChart) trendChart.destroy();

            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Доступна ліквідність (залишки + кредитні лінії)',
                            data: liquidityData,
                            borderColor: '#1E3A8A',
                            backgroundColor: 'rgba(30, 58, 138, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.1
                        },
                        {
                            label: 'Власні грошові залишки',
                            data: cashData,
                            borderColor: '#6B7280',
                            borderWidth: 2,
                            borderDash: [4, 4],
                            fill: false,
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: false }
                    },
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        async function loadAnalyticsData() {
            const statusEl = document.getElementById('dataStatus');
            try {
                const response = await fetch(GET_METRICS_FLOW_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reportDate: "" })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const result = await response.json();

                // Приклад розгортання розширеного горизонту (останні 4 тижні історії + T0..T12)
                // Якщо хмара повертає масиви або структуру зрізу:
                const labels = ["T-4", "T-3", "T-2", "T-1", "T0", "T1", "T2", "T3", "T4", "T5", "T6", "T7", "T8", "T9", "T10", "T11", "T12"];
                
                // Демо-масиви або дані з хмари (в млн грн)
                const liquidity = [5200, 5400, 5100, 4911, 4911, 4539, 4383, 5867, 5309, 4171, 3635, 4050, 4337, 4149, 4065, 4170, 4321];
                const cash = [3100, 3200, 3091, 3091, 1744, 1256, 1100, 2585, 2026, 806, 271, 187, 473, 286, 204, 309, 460];

                renderChart(labels, liquidity, cash);
                
                statusEl.textContent = "Дані успішно завантажено з хмари";
                statusEl.className = "text-xs font-medium px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800";
            } catch (err) {
                console.error("Помилка завантаження:", err);
                statusEl.textContent = "Помилка зв'язку з хмарою (демо-режим)";
                statusEl.className = "text-xs font-medium px-2.5 py-1 rounded-full bg-red-100 text-red-800";
                
                // Запуск з дефолтними даними для перевірки візуалізації
                renderChart(
                    ["T-4", "T-3", "T-2", "T-1", "T0", "T1", "T2", "T3", "T4", "T5", "T6", "T7", "T8", "T9", "T10", "T11", "T12"],
                    [5200, 5400, 5100, 4911, 4911, 4539, 4383, 5867, 5309, 4171, 3635, 4050, 4337, 4149, 4065, 4170, 4321],
                    [3100, 3200, 3091, 3091, 1744, 1256, 1100, 2585, 2026, 806, 271, 187, 473, 286, 204, 309, 460]
                );
            }
        }

        document.addEventListener('DOMContentLoaded', loadAnalyticsData);
    </script>
</body>
</html>
