<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПРОГНОЗ РУХУ КОШТІВ АТ «УКРНАФТА» на 13 тижнів</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        
        :root {
            /* Динамічні змінні для друку (розраховуються скриптом під 1 сторінку в ширину і 2 у висоту) */
            --p-base-font: 8.5pt;
            --p-cell-pad-y: 2.2px;
            --p-cell-pad-x: 3.5px;
            --p-nm-width: 340px;
        }

        body { font-family: 'Helvetica', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f3f4f6; color: #334155; padding: 12px; margin: 0; }
        
        /* Базовий стиль контейнера */
        .executive-container {
            min-height: 900px; margin: 0 auto; background-color: #fff;
            padding: 20px 26px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,.1);
            display: flex; flex-direction: column; gap: 10px;
            transition: width 0.2s ease, max-width 0.2s ease;
        }

        /* Режим А3 на екрані */
        .view-a3 body { height: auto; overflow: auto; }
        .view-a3 .executive-container,
        .view-a3 nav { width: 1587px !important; max-width: 1587px !important; }
        .view-a3 .an-wrap { max-height: 780px; }

        /* Режим на весь екран (по замовчуванню) */
        body.view-fluid {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 10px;
        }
        .view-fluid nav {
            width: 100% !important;
            max-width: 100% !important;
            margin-bottom: 8px !important;
            flex-shrink: 0;
        }
        .view-fluid .executive-container {
            width: 100% !important;
            max-width: 100% !important;
            min-height: 0 !important;
            flex: 1 1 0%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 14px 18px;
        }
        .view-fluid .card {
            flex: 1 1 0%;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            padding: 4px;
        }
        .view-fluid .an-wrap {
            max-height: none !important;
            height: 100%;
            flex: 1 1 0%;
        }

        .card { background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .an-wrap { overflow: auto; max-height: 780px; }
        .an-table { width: 100%; border-collapse: collapse; font-size: 8.5pt; font-variant-numeric: tabular-nums; }
        .an-table th { font-size: 8pt; color: #475569; font-weight: 600; padding: 4px 4px; border-bottom: 1.5px solid #94a3b8;
                       text-align: right; background: #f8fafc; white-space: nowrap; position: sticky; top: 0; z-index: 2; }
        .an-table th.nm-col, .an-table td.nm-col { text-align: left; min-width: 360px; position: sticky; left: 0; background: #fff; z-index: 1; }
        .an-table th.nm-col { z-index: 3; background: #f8fafc; }
        .an-table th .th-period { display: block; font-size: 7pt; font-weight: 500; color: #94a3b8; line-height: 1.15; margin-top: 1px; white-space: normal; }
        .an-table td { padding: 2.5px 4px; text-align: right; color: #334155; border-bottom: 1px solid #eef2f6; white-space: nowrap; }
        .an-table tbody tr:hover td { background-color: #f8fafc; }

        /* Екранна стилізація рівнів */
        tr.lvl-block td { background: #e0e7ff; font-weight: 700; color: #312e81; font-size: 9pt; }
        tr.lvl-item  td { font-weight: 700; color: #1e293b; background: #f8fafc; }
        tr.lvl-sub   td { font-weight: 600; color: #334155; }
        tr.lvl-leaf  td { color: #475569; font-size: 8pt; font-weight: 400; }
        tr.row-key   td { background: #dbeafe !important; color: #1e3a8a; font-weight: 700; border-top: 1px solid #93c5fd; border-bottom: 1px solid #93c5fd; }
        tr.row-cover td { color: #047857; }
        tr.row-blue td { color: #1d4ed8; font-weight: 600; }
        tr.row-blue td.nm-col .nm-txt { color: #1d4ed8; }
        tr.row-cover td.nm-col .nm-txt { color: #047857; font-weight: 600; }

        td.col-mon, th.col-mon { background: #fafaff; color: #4338ca; font-weight: 600; }
        td.col-sum, th.col-sum { border-left: 1.5px solid #cbd5e1; font-weight: 700; }
        td.col-prev, th.col-prev { background: #fafafa; }
        .an-table tbody td.neg { color: #dc2626 !important; }
        .an-table tbody td.col-dev.pos { color: #047857 !important; font-weight: 600; }
        .an-table tbody td.col-dev.neg { font-weight: 600; }
        td.zero { color: #cbd5e1; }

        .toggle-kids { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px;
            font-size: 11px; font-weight: bold; line-height: 1; color: #3b82f6; background: #eff6ff; border: 1px solid #bfdbfe;
            border-radius: 3px; cursor: pointer; user-select: none; flex: 0 0 auto; margin-right: 5px; }
        .toggle-kids:hover { background: #dbeafe; color: #1d4ed8; }
        .toggle-placeholder { display: inline-block; width: 19px; }
        .mon-toggle { display: inline-block; margin-left: 4px; padding: 0 3px; border: 1px solid #c7d2fe; border-radius: 3px;
            background: #eef2ff; color: #4338ca; cursor: pointer; font-size: 7.5pt; }
        .an-code { color: #64748b; font-size: 8pt; margin-right: 4px; }
        .ctl { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px; cursor: pointer; border: 1px solid #e2e8f0; background: #fff; color: #475569; }
        .ctl.active { background: #4f46e5; color: #fff; border-color: #4f46e5; }

        /* Стилі для аркуша А3 у модальному вікні */
        .a3-sheet {
            width: 1587px;
            min-height: 1122px;
            background: #ffffff;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 24px 28px;
            box-sizing: border-box;
            transform-origin: top center;
            transition: transform 0.15s ease-out;
            margin: 15px auto;
        }

        /* ------------------------------------------------------------- */
        /* АДАПТИВНІ ДРУКОВАНІ СТИЛІ (МАСШТАБУЮТЬСЯ ЧЕРЕЗ CSS-ЗМІННІ)    */
        /* ------------------------------------------------------------- */
        .print-mode .executive-container,
        @media print {
            .executive-container { width: 100% !important; max-width: 100% !important; padding: 0 !important; box-shadow: none !important; border-radius: 0 !important; }
            .card { border: none !important; padding: 0 !important; }
            .an-wrap { max-height: none !important; overflow: visible !important; }
            
            .an-table {
                width: 100% !important;
                border-collapse: collapse !important;
                table-layout: auto !important;
            }

            /* Шапка таблиці */
            .an-table th {
                font-size: calc(var(--p-base-font) * 1.05) !important;
                padding: calc(var(--p-cell-pad-y) * 1.2) var(--p-cell-pad-x) !important;
                line-height: 1.15 !important;
                border-bottom: 1.5px solid #475569 !important;
            }
            .an-table th.nm-col,
            .an-table td.nm-col {
                width: var(--p-nm-width) !important;
                min-width: var(--p-nm-width) !important;
                max-width: calc(var(--p-nm-width) * 1.2) !important;
                white-space: normal !important;
                line-height: 1.15 !important;
            }
            .an-table th .th-period {
                font-size: calc(var(--p-base-font) * 0.82) !important;
                line-height: 1 !important;
            }

            /* 1. Блоки ("Надходження", "Видатки") */
            tr.lvl-block td {
                font-size: calc(var(--p-base-font) * 1.25) !important;
                font-weight: 800 !important;
                background: #f1f5f9 !important;
                color: #0f172a !important;
                padding: calc(var(--p-cell-pad-y) * 1.6) var(--p-cell-pad-x) !important;
                border-top: 1.5px solid #94a3b8 !important;
                border-bottom: 1.5px solid #94a3b8 !important;
            }

            /* 2. Батьківські статті ("1 Нафта", "2 Газ", "1 Обов'язкові платежі") */
            tr.lvl-item td {
                font-size: calc(var(--p-base-font) * 1.12) !important;
                font-weight: 700 !important;
                color: #1e293b !important;
                background: #fafafa !important;
                padding: calc(var(--p-cell-pad-y) * 1.2) var(--p-cell-pad-x) !important;
            }

            /* 3. Підсумки груп другого рівня ("Податки", "Державні податки") */
            tr.lvl-sub td {
                font-size: calc(var(--p-base-font) * 1.02) !important;
                font-weight: 600 !important;
                color: #334155 !important;
                padding: var(--p-cell-pad-y) var(--p-cell-pad-x) !important;
            }

            /* 4. Дочірні рядки та цифри (контрагенти, деталі) */
            tr.lvl-leaf td {
                font-size: var(--p-base-font) !important;
                font-weight: 400 !important;
                color: #334155 !important;
                padding: var(--p-cell-pad-y) var(--p-cell-pad-x) !important;
                line-height: 1.12 !important;
            }

            /* Ключові підсумки ("Всього надходжень", "Всього витрат", "Чистий грошовий потік") */
            tr.row-key td {
                font-size: calc(var(--p-base-font) * 1.18) !important;
                font-weight: 800 !important;
                background: #e2e8f0 !important;
                border-top: 1.5px solid #475569 !important;
                border-bottom: 1.5px solid #475569 !important;
                padding: calc(var(--p-cell-pad-y) * 1.4) var(--p-cell-pad-x) !important;
            }

            .toggle-kids, .mon-toggle, .toggle-placeholder {
                display: none !important;
            }

            tr {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
        }

        @media print {
            @page {
                size: A3 landscape;
                margin: 6mm 5mm !important;
            }
            html, body {
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
                background: #fff !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .print-hide, #printPreviewModal {
                display: none !important;
            }
        }
    </style>
</head>

    <script>
    const GET_METRICS_FLOW_URL = "https://defaultce629f5605df43c6b9798b0b7992fc.55.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/28/workflows/76596625557146c6882e837e2fb46961/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=mWBVsXd5FLyjoME7JGEBX1Zo4zfdQKt1Fi46spXVdFU";

    let SNAP = null, NODES = [], TREE = null, expanded = {}, UNIT = 'ths';
    let monthOpen = { M1: true, M2: false, M3: false };
    const DAY = 86400000;
    const isoOf = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    const mondayOf = d => { const x = new Date(d); x.setHours(12, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return isoOf(x); };
    const isoShift = (iso, days) => isoOf(new Date(Date.parse(iso + 'T12:00:00') + days * DAY));

    let currentReportDate = mondayOf(new Date());
    let calViewDate = new Date(currentReportDate + 'T12:00:00');
    const availableDates = new Set();

    const dmy = iso => String(iso || '').split('-').reverse().join('.');
    const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const sp = s => s.replace(/[\u202F\u00A0]/g, ' ');

    function setViewMode(mode) {
        const body = document.body;
        const btnFluid = document.getElementById('btnViewFluid');
        const btnA3 = document.getElementById('btnViewA3');
        if (mode === 'a3') {
            body.classList.remove('view-fluid');
            body.classList.add('view-a3');

    // -------------------------------------------------------------
    // АДАПТИВНИЙ РОЗРАХУНОК РОЗМІРІВ ДЛЯ 1 СТОРІНКИ В ШИРИНУ ТА 2 У ВИСОТУ
    // -------------------------------------------------------------
    function calculateAdaptivePrintScale() {
        const activeColsCount = activeColumns().length;
        const visibleRowsCount = visibleRows().length;

        // Доступна корисна ширина аркуша A3 landscape за вирахуванням полів
        const targetA3Width = 1530; 
        // Доступна висота для рівно двох сторінок A3 (1122 * 2 = 2244px мінус поля й колонтитули)
        const target2PagesHeight = 2050; 

        // 1. Ширина першої колонки "Стаття" залежно від кількості колонок
        let nmColWidth = 340;
        if (activeColsCount > 22) nmColWidth = 270;
        else if (activeColsCount > 18) nmColWidth = 300;
        else if (activeColsCount < 14) nmColWidth = 400;

        // 2. Ширина однієї числової колонки за замовчуванням
        const remainingWidth = targetA3Width - nmColWidth;
        const widthPerCol = remainingWidth / Math.max(1, activeColsCount);

        // 3. Масштабування шрифту за шириною
        let scaleX = widthPerCol / 62; 
        scaleX = Math.max(0.68, Math.min(1.45, scaleX));

        // 4. Масштабування за висотою (для розподілу точно на 2 сторінки)
        // Висота шапки + відступи ~140px; залишок ділимо на кількість рядків
        const heightAvailableForRows = target2PagesHeight - 140;
        const targetRowHeight = heightAvailableForRows / Math.max(30, visibleRowsCount);
        
        let scaleY = targetRowHeight / 24; 
        scaleY = Math.max(0.70, Math.min(1.35, scaleY));

        // Беремо спільний масштаб, щоб ідеально вкластися і по ширині, і по висоті
        const optimalScale = Math.min(scaleX, scaleY);

        // Обчислюємо фінальні розміри
        const finalBaseFont = Math.round(8.5 * optimalScale * 10) / 10;
        const finalPadY = Math.round(2.2 * optimalScale * 10) / 10;
        const finalPadX = Math.round(3.5 * optimalScale * 10) / 10;

        // Записуємо в кореневі CSS-змінні
        document.documentElement.style.setProperty('--p-base-font', `${finalBaseFont}pt`);
        document.documentElement.style.setProperty('--p-cell-pad-y', `${finalPadY}px`);
        document.documentElement.style.setProperty('--p-cell-pad-x', `${finalPadX}px`);
        document.documentElement.style.setProperty('--p-nm-width', `${nmColWidth}px`);
    }

    function extractSnapshotObject(obj) {
        if (!obj || typeof obj !== 'object') return null;
        if (obj.tree && obj.meta) return obj;
        const cand = [obj.snapshot, obj.content, obj.body, obj.value, obj.data, obj.result, obj.json];
        for (const c of cand) {
            if (!c) continue;
            if (typeof c === 'string') { try { const r = extractSnapshotObject(JSON.parse(c)); if (r) return r; } catch (e) {} continue; }
            const r = extractSnapshotObject(c);
            if (r) return r;
        }
        if (Array.isArray(obj)) for (const it of obj) { const r = extractSnapshotObject(it); if (r) return r; }
        return null;
    }

    function resetDefaultExpanded() {
        expanded = {};

    // ---------- Відновлення ієрархії статей ----------
    const NORM_KEYS = ['T0','T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'];
    const nvals = r => NORM_KEYS.map(k => (r.values && r.values[k]) || 0);
    const nNonZero = v => v.some(x => Math.abs(x) >= 1);
    const nSame = (a, b) => a.every((v, i) => Math.abs(v - b[i]) < 1);
    const nAdd = (a, b) => a.map((v, i) => v + b[i]);
    const clean = s => String(s == null ? '' : s).replace(/\s+/g, ' ').replace(/[’']/g, "'").trim();
    const SUMMARY_RE = /^(Всього|КОНТРОЛЬ|Контроль|Грошовий потік|Чистий грошовий|Доступн|Залишки|Заборгован|Різниця|Надходження \(|Видатки \(|\*Інформаційно|Придбання МЗНН)/;

    const LEVEL_HINTS = {
        'Податки': 1, 'Державні податки': 2, 'Рентна плата': 3, 'Інші податки': 2, 'Місцеві податки': 3,
        'Заробітна плата': 1, 'Енергія': 1, "Інші обов'язкові операційні платежі": 1
    };
    const DROP_ROWS = [/^КОНТРОЛЬ витрат по напрямках/i];
    const LAST_ROW_RE = /^\*?\s*Інформаційно: придбання НП/i;

    function groupBySums(list) {
        const n = list.length, memo = new Array(n).fill(null);
        const node = i => {
            if (memo[i]) return memo[i];
            const r = list[i].row, own = nvals(r);
            let out = { item: list[i], kids: [], next: i + 1 };
            memo[i] = out;
            if (nNonZero(own)) {
                let k = i + 1, kids = [], cum = NORM_KEYS.map(() => 0);
                while (k < n) {
                    const c = node(k);
                    if (kids.length && c.kids.length && (c.item.row.kind === 'total' || c.item.row.kind === 'subgroup')) break;
                    kids.push(c); cum = nAdd(cum, nvals(c.item.row)); k = c.next;
                    const enough = kids.length >= 2 || r.kind === 'total' || r.kind === 'subgroup';
                    if (enough && nSame(cum, own)) {
                        while (k < n && !nNonZero(nvals(list[k].row))) { const z = node(k); kids.push(z); k = z.next; }
                        out = { item: list[i], kids, next: k }; memo[i] = out; break;
                    }
                }
            }
            return out;
        };
        const top = []; let i = 0;
        while (i < n) { const c = node(i); top.push(c); i = c.next; }
        return top;
    }

    function groupByHints(list) {
        const top = [], stack = [];
        const close = () => stack.pop();
        list.forEach(entry => {
            const r = entry.row, name = clean(r.name);
            const hint = LEVEL_HINTS[name];
            const nd = { item: entry, kids: [], cum: NORM_KEYS.map(() => 0), own: nvals(r) };
            if (hint) { while (stack.length && stack[stack.length - 1].lvl >= hint) close(); }
            const par = stack.length ? stack[stack.length - 1] : null;
            (par ? par.node.kids : top).push(nd);
            if (par) {
                let p = stack.length - 1;
                while (p >= 0) {
                    stack[p].node.cum = nAdd(stack[p].node.cum, nvals(r));
                    if (nNonZero(stack[p].node.own) && nSame(stack[p].node.cum, stack[p].node.own)) { stack.length = p; break; }
                    p--;
                }
            }
            const isGroup = r.kind === 'total' || r.kind === 'subgroup' || hint;
            if (isGroup) stack.push({ lvl: hint || ((stack.length ? stack[stack.length - 1].lvl : 0) + 1), node: nd });
        });
        return top;
    }

    function buildTree(rows) {
        let dropping = false;
        const lastIdx = rows.findIndex(r => LAST_ROW_RE.test(clean(r.name)));
        const usable = rows.filter((r, i) => {
            if (lastIdx >= 0 && i > lastIdx) return false;
            if (r.kind === 'block') dropping = false;
            if (DROP_ROWS.some(re => re.test(clean(r.name)))) { dropping = true; return false; }
            if (dropping) return false;
            return !!clean(r.name);
        });
        const mk = r => ({ row: r, children: [], pending: [] });
        const roots = []; let stack = [], block = null, pend = null;
        usable.forEach(r => {
            const no = String(r.no == null ? '' : r.no).trim();
            const nd = mk(r);
            if (r.kind === 'block') { roots.push(nd); block = nd; stack = [{ lvl: 0, nd }]; pend = nd; }
            else if (r.kind === 'item' && no) {
                const lvl = 1 + Math.max(0, no.split('.').length - 1);
                while (stack.length && stack[stack.length - 1].lvl >= lvl) stack.pop();
                const par = stack.length ? stack[stack.length - 1].nd : null;
                (par ? par.pending : roots).push(nd);
                stack.push({ lvl, nd }); pend = nd;
            } else if (r.kind === 'total' && !r.code && !no && SUMMARY_RE.test(clean(r.name)) && block) {
                while (stack.length > 1) stack.pop();
                block.pending.push(nd); pend = block;
            } else (pend ? pend.pending : roots).push(nd);
        });
        const finalize = nd => {
            if (nd.pending.length) {
                const hinted = nd.pending.some(p => LEVEL_HINTS[clean(p.row.name)]);
                const grouped = hinted ? groupByHints(nd.pending) : groupBySums(nd.pending);
                const conv = g => { const c = g.item; finalize(c); c.children = g.kids.map(conv).concat(c.children); return c; };
                nd.children = grouped.map(conv).concat(nd.children);
            }
            nd.pending = [];
        };
        roots.forEach(finalize);
        const toPlain = nd => Object.assign({}, nd.row, { children: nd.children.map(toPlain) });
        return roots.map(toPlain).filter(n => n.kind !== 'block' || (n.children && n.children.length));
    }

    function indexTree(tree) {
        const list = [];
        const walk = (nodes, parentId, depth, prefix) => {
            (nodes || []).forEach((n, i) => {
                const id = prefix + '/' + i;
                const rec = { id, parentId, depth, node: n, name: n.name || '', kind: n.kind || '',
                              no: n.no, code: n.code, src_row: n.src_row, keep: n.keep, childIds: [] };
                list.push(rec);
                if (parentId != null) { const p = list.find(x => x.id === parentId); if (p) p.childIds.push(id); }
                if (n.children && n.children.length) walk(n.children, id, depth + 1, id);
            });
        };
        walk(tree, null, 0, '');
        return list;
    }
    const byId = id => NODES.find(n => n.id === id);

    // ---------- Завантаження ----------
    function applySnapshot(envelope, requestedIso) {
        const snap = extractSnapshotObject(envelope);
        if (!snap) throw new Error('у відповіді немає снапшоту (meta + tree)');
        SNAP = snap;
        TREE = buildTree(snap.rows || []);
        NODES = indexTree(TREE);
        resetDefaultExpanded();
        document.getElementById('expandAll').checked = false;
        const m = snap.meta || {};
        const iso = m.forecast_date || requestedIso || '';
        if (iso) { currentReportDate = iso; availableDates.add(iso); }
        document.getElementById('navCurDate').textContent = iso ? dmy(iso) : '--';
        document.getElementById('hdrCur').textContent = iso ? dmy(iso) : '--';
        document.getElementById('lblSelectedDate').textContent = iso ? dmy(iso) : 'Обрати дату';
        document.getElementById('hdrCreated').textContent = m.created_utc
            ? 'створено: ' + String(m.created_utc).replace('T', ' ').slice(0, 19) + ' UTC' : '';
        const c = snap.columns || {};
        document.getElementById('hdrRange').textContent =
            ((c.T0 && c.T0.date_range) || '') + ' – ' + ((c.T12 && c.T12.date_range) || '');
        render();
    }

    async function fetchSnapshot(iso) {
        const res = await fetch(GET_METRICS_FLOW_URL, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reportDate: iso, reportDateDot: dmy(iso) })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
    }

    async function loadFromCloud(iso) {
        setStatus('Завантаження…', 'bg-indigo-100 text-indigo-800');
        try {
            applySnapshot(await fetchSnapshot(iso), iso);
            setStatus('Зріз ' + dmy(currentReportDate), 'bg-emerald-100 text-emerald-800');
        } catch (err) {
            setStatus('Дані недоступні: ' + err.message + ' — можна відкрити локальний JSON', 'bg-red-100 text-red-800');
        }
    }

    async function loadLatestMonday(weeksBack) {
        let iso = mondayOf(new Date());
        const limit = weeksBack || 8;
        setStatus('Пошук останнього зрізу…', 'bg-indigo-100 text-indigo-800');
        for (let i = 0; i < limit; i++) {
            try {
                const data = await fetchSnapshot(iso);
                applySnapshot(data, iso);
                setStatus('Зріз ' + dmy(currentReportDate) + (i ? ' (останній наявний)' : ''), 'bg-emerald-100 text-emerald-800');
                return iso;
            } catch (e) { iso = isoShift(iso, -7); }
        }
        setStatus('Зрізів за останні ' + limit + ' тижнів не знайдено — можна відкрити локальний JSON', 'bg-red-100 text-red-800');
        return null;
    }

    function loadLocalFile(input) {
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            try { applySnapshot(JSON.parse(reader.result), null); setStatus('Зріз ' + dmy(currentReportDate), 'bg-emerald-100 text-emerald-800'); }
            catch (e) { setStatus('Не вдалося прочитати файл: ' + e.message, 'bg-red-100 text-red-800'); }
        };
        reader.readAsText(file, 'utf-8');
        input.value = '';
    }

    // ---------- Колонки ----------
    const MONTHS = [
        { key: 'M1', weeks: ['T0', 'T1', 'T2', 'T3'] },
        { key: 'M2', weeks: ['T4', 'T5', 'T6', 'T7'] },
        { key: 'M3', weeks: ['T8', 'T9', 'T10', 'T11', 'T12'] }
    ];
    const PREV_KEYS = ['Tm1_plan', 'Tm1_forecast', 'dev_forecast', 'Tm1_fact', 'dev_fact'];
    const MONTH_KEYS = MONTHS.map(m => m.key);
    const DEV_KEYS = ['dev_forecast', 'dev_fact'];

    function activeColumns() {
        const cols = SNAP.columns || {}, keys = [];
        PREV_KEYS.forEach(k => {
            const box = document.getElementById('col' + k);
            if (box && box.checked && cols[k]) keys.push(k);
        });
        MONTHS.forEach(m => {
            if (monthOpen[m.key]) m.weeks.forEach(w => cols[w] && keys.push(w));
            if (cols[m.key]) keys.push(m.key);
        });
        if (document.getElementById('grpTotal').checked && cols.TT0_12) keys.push('TT0_12');
        return keys;
    }

    function setUnit(u) {
        UNIT = u;
        document.getElementById('unitThs').className = 'ctl' + (u === 'ths' ? ' active' : '');
        document.getElementById('unitMln').className = 'ctl' + (u === 'mln' ? ' active' : '');
        document.getElementById('hdrUnit').textContent = u === 'ths' ? 'тис. грн' : 'млн грн';
        render();
    }
    const unitDiv = () => (UNIT === 'ths' ? 1e3 : 1e6);

    function fmtCell(v) {
        if (v == null || isNaN(v)) return { txt: '', cls: 'zero' };
        const r = Math.round(v / unitDiv());
        if (r === 0) return { txt: '0', cls: 'zero' };
        return { txt: (r < 0 ? '−' : '') + sp(Math.abs(r).toLocaleString('uk-UA')), cls: r < 0 ? 'neg' : '' };
    }

    function toggleMonth(k) { monthOpen[k] = !monthOpen[k]; render(); }
    function toggleNode(id) {
        const expandAllBox = document.getElementById('expandAll');
        if (expandAllBox.checked) {
            expandAllBox.checked = false;
            NODES.forEach(n => { expanded[n.id] = true; });
        }
        expanded[id] = !isExpanded(id);
        render();
    }
    const isExpanded = id => (document.getElementById('expandAll').checked ? true : !!expanded[id]);

    // ---------- Рядки ----------
    const KEY_ROWS = [/^Всього витрат/i, /^Всього видатків/i, /^Всього надходжень/i, /^Грошовий потік/i, /^Чистий грошовий потік/i];
    const BLUE_ROWS = [/^Доступні залишки/i, /^Залишки доступні до використання/i];
    const COVER_ROWS = [/^Повернення покриття/i, /^Розміщення покриття постімпорт/i, /^Оплата по постімпорту/i, /^постімпорт$/i];
    const isKeyRow = n => KEY_ROWS.some(re => re.test(clean(n.name)));
    const isCoverRow = n => COVER_ROWS.some(re => re.test(clean(n.name)));
    const isBlueRow = n => BLUE_ROWS.some(re => re.test(clean(n.name)));

    function matches(rec) {
        const q = clean(document.getElementById('searchBox').value).toLowerCase();
        if (!q) return true;
        return [rec.name, rec.code, rec.no].some(v => String(v == null ? '' : v).toLowerCase().includes(q));
    }
    const allZero = rec => !nNonZero(nvals(rec.node)) && !rec.childIds.some(id => nNonZero(nvals(byId(id).node)));

    function visibleRows() {
        const onlyKeep = document.getElementById('onlyKeep').checked;
        const hideZero = document.getElementById('hideZero').checked;
        const q = clean(document.getElementById('searchBox').value);
        const hits = new Set();
        if (q) NODES.filter(matches).forEach(r => { let c = r; while (c) { hits.add(c.id); c = c.parentId ? byId(c.parentId) : null; } });
        const out = [];
        const walk = ids => ids.forEach(id => {
            const rec = byId(id);
            if (!rec) return;
            if (onlyKeep && rec.keep === false) return;
            if (hideZero && allZero(rec)) return;
            if (q && !hits.has(id)) return;
            out.push(rec);
            if (rec.childIds.length && (q ? true : isExpanded(id))) walk(rec.childIds);
        });
        walk(NODES.filter(n => n.parentId === null).map(n => n.id));
        return out;
    }

    function formatColumnLabel(k, label) {
        if (k === 'dev_fact') {
            return 'Відхилення,<br><span style="font-weight: 500; font-size: 7.5pt;">+/- (факт - план)</span>';
        }
        if (k === 'dev_forecast') {
            return 'Відхилення,<br><span style="font-weight: 500; font-size: 7.5pt;">+/- (прогноз - план)</span>';
        }
        if (/відхилення/i.test(label) && /факт/i.test(label)) {
            return 'Відхилення,<br><span style="font-weight: 500; font-size: 7.5pt;">+/- (факт - план)</span>';
        }
        return esc(label);
    }

    function render() {
        const pane = document.getElementById('pane');
        if (!SNAP) { pane.innerHTML = '<div class="text-xs text-slate-400 p-3">Дані ще не завантажені. Оберіть дату зрізу або відкрийте локальний файл.</div>'; return; }
        const cols = SNAP.columns || {}, keys = activeColumns();

        const head = `<tr><th class="nm-col">Стаття</th>${keys.map(k => {
            const c = cols[k] || {};
            const isMon = MONTH_KEYS.indexOf(k) >= 0;
            const cls = k === 'TT0_12' ? 'col-sum' : isMon ? 'col-mon'
                      : DEV_KEYS.indexOf(k) >= 0 ? 'col-prev col-dev' : (PREV_KEYS.indexOf(k) >= 0 ? 'col-prev' : '');
            const rawLabel = (c.label || k).replace(/\s+/g, ' ').trim();
            const formattedLabel = formatColumnLabel(k, rawLabel);
            const toggle = isMon
                ? `<span class="mon-toggle" title="${monthOpen[k] ? 'Згорнути тижні місяця' : 'Показати тижні місяця'}" onclick="toggleMonth('${k}')">${monthOpen[k] ? '−' : '+'}</span>`
                : '';
            
            const mainText = c.date_range ? esc(c.date_range) : formattedLabel;
            const subText = c.date_range ? `<span class="th-period">${formattedLabel}</span>` : '';

            return `<th class="${cls}">${mainText}${toggle}${subText}</th>`;
        }).join('')}</tr>`;

        const recs = visibleRows();
        const body = recs.map(rec => {
            const n = rec.node, hasKids = rec.childIds.length > 0, open = isExpanded(rec.id);
            const toggle = hasKids
                ? `<span class="toggle-kids" onclick="event.stopPropagation(); toggleNode('${esc(rec.id)}')">${open ? '−' : '+'}</span>`
                : '<span class="toggle-placeholder"></span>';
            
            const lvl = rec.kind === 'block' ? 'lvl-block'
                      : rec.kind === 'item' ? 'lvl-item'
                      : (rec.kind === 'total' || rec.kind === 'subgroup') ? 'lvl-sub' : 'lvl-leaf';
            
            const extra = (isKeyRow(n) ? ' row-key' : '') + (isCoverRow(n) ? ' row-cover' : '') + (isBlueRow(n) ? ' row-blue' : '');
            const codeTxt = String(n.no == null ? '' : n.no).trim();
            const cells = keys.map(k => {
                const c = fmtCell((n.values || {})[k]);
                const isMon = MONTH_KEYS.indexOf(k) >= 0;
                const isDev = DEV_KEYS.indexOf(k) >= 0;
                const base = k === 'TT0_12' ? 'col-sum ' : isMon ? 'col-mon '
                           : isDev ? 'col-prev col-dev ' : (PREV_KEYS.indexOf(k) >= 0 ? 'col-prev ' : '');
                const cls = base + c.cls + (isDev && c.cls === '' ? ' pos' : '');
                return `<td class="${cls}">${c.txt}</td>`;
            }).join('');
            
            const padLeft = 4 + rec.depth * 13;
            return `<tr class="${lvl}${extra}" onclick="${hasKids ? `toggleNode('${esc(rec.id)}')` : ''}">
                <td class="nm-col" style="padding-left:${padLeft}px">${toggle}${codeTxt ? `<span class="an-code">${esc(codeTxt)}</span>` : ''}<span class="nm-txt">${esc(n.name)}</span></td>
                ${cells}</tr>`;
        }).join('');

        pane.innerHTML = keys.length
            ? `<table class="an-table"><thead>${head}</thead><tbody>${body}</tbody></table>`
            : '<div class="text-xs text-slate-400 p-3">Оберіть хоча б одну групу колонок.</div>';
    }

    // ---------- Календар ----------
    function toggleCalendarDropdown() { document.getElementById('calendarDropdown').classList.toggle('hidden'); renderCalendar(); }
    function changeCalendarMonth(d) { calViewDate.setMonth(calViewDate.getMonth() + d); renderCalendar(); }
    function renderCalendar() {
        const NAMES = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
        const y = calViewDate.getFullYear(), mo = calViewDate.getMonth();
        document.getElementById('calendarMonthYear').textContent = `${NAMES[mo]} ${y}`;
        const first = new Date(y, mo, 1), days = new Date(y, mo + 1, 0).getDate();
        let html = '<span></span>'.repeat((first.getDay() + 6) % 7);
        for (let d = 1; d <= days; d++) {
            const iso = `${y}-${String(mo + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const cur = iso === currentReportDate, known = availableDates.has(iso);
            html += `<button onclick="selectDate('${iso}')" class="p-1 rounded-md ${cur ? 'bg-indigo-600 text-white font-bold' : known ? 'bg-indigo-50 text-indigo-700' : 'hover:bg-slate-100 text-slate-700'}">${d}</button>`;
        }
        document.getElementById('calendarDaysGrid').innerHTML = html;
    }
    function selectDate(iso) {
        currentReportDate = iso;
        calViewDate = new Date(iso + 'T00:00:00');
        document.getElementById('lblSelectedDate').textContent = dmy(iso);
        document.getElementById('calendarDropdown').classList.add('hidden');
        loadFromCloud(iso);
    }

    function init() {
        document.getElementById('lblSelectedDate').textContent = dmy(currentReportDate);
        setViewMode('fluid');
        renderCalendar();
        render();
        setStatus('Очікування даних…', 'bg-amber-100 text-amber-800');
        if (typeof fetch === 'function') loadLatestMonday();
    }
    window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
