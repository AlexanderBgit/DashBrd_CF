<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Cash Flow Dashboard - Аналітика</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Helvetica', sans-serif; background-color: #f3f4f6; color: #334155; }
        .executive-container { max-width: 1750px; margin: 0 auto; background-color: #ffffff; padding: 20px 20px; box-sizing: border-box; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        .exec-table { width: 100%; border-collapse: collapse; font-size: 8.5pt; table-layout: fixed; }
        .exec-table th { font-size: 8.5pt; color: #64748b; font-weight: 600; padding: 3px 2px; border-bottom: 1.5px solid #94a3b8; text-align: right; background-color: #f8fafc; overflow: hidden; }
        .exec-table th:first-child { text-align: left; width: 220px; }
        .exec-table th .th-period { display: block; font-size: 6pt; font-weight: 500; color: #94a3b8; letter-spacing: -0.3px; white-space: nowrap; line-height: 1.1; margin-top: 1px; }
        .exec-table td { padding: 2px 2px; text-align: right; color: #334155; border-bottom: 1px solid #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 8.5pt; }
        .exec-table td:first-child { text-align: left; font-weight: 500; white-space: nowrap; }

        /* Клас для примусового приховування елементів на час генерації PDF */
        .pdf-hidden { display: none !important; }

        @media print {
            @page { size: A3 landscape; margin: 0 !important; }
            body { background-color: #ffffff !important; padding: 0 !important; }
            .print-hide, nav { display: none !important; }
            .executive-container { box-shadow: none !important; border: none !important; width: 100% !important; max-width: none !important; padding: 5px !important; }
        }
    </style>
</head>
<body class="p-2">

    <!-- Верхня панель керування -->
    <nav class="bg-white shadow p-3 mb-4 rounded-lg max-w-[1750px] mx-auto flex justify-between items-center print-hide">
        <div>
            <h1 class="text-lg font-bold text-slate-800">Executive Cash Flow Dashboard — Аналітика</h1>
            <p class="text-xs text-slate-500 mt-0.5">Звітна дата зрізу: <span id="headerReportDate" class="font-semibold text-indigo-600">--</span></p>
        </div>
        
        <div class="flex items-center gap-4">
            <span id="dataStatus" class="text-xs font-medium px-2.5 py-1 rounded-full bg-amber-100 text-amber-800">Очікування хмари...</span>
            
            <div class="flex items-center gap-1.5 border-l pl-4 border-slate-200">
                <!-- Змінено назву кнопки на PDF -->
                <button onclick="generatePDF()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg font-semibold text-xs flex items-center gap-1 cursor-pointer shadow-sm" title="Вивантажити у високій чіткості в PDF">
                    <span>PDF</span>
                </button>
                <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg font-semibold text-xs flex items-center gap-1 cursor-pointer shadow-sm" title="Друк звіту">
                    <span>Друк</span>
                </button>
            </div>

            <!-- Календар -->
            <div class="relative">
                <button onclick="toggleCalendarDropdown()" id="btnCalendarTrigger" class="bg-slate-100 hover:bg-slate-200 text-slate-800 px-3 py-1 rounded-full font-bold text-xs flex items-center gap-2 border border-slate-300 cursor-pointer">
                    <span id="lblSelectedDate">Обрати дату</span>
                </button>
                <div id="calendarDropdown" class="absolute top-11 right-0 bg-white border border-slate-200 rounded-2xl shadow-2xl p-4 w-72 hidden z-50">
                    <div class="flex justify-between items-center mb-3">
                        <button onclick="changeCalendarMonth(-1)" class="p-1 hover:bg-slate-100 rounded-lg font-bold">&larr;</button>
                        <span id="calendarMonthYear" class="font-bold text-xs text-slate-800 uppercase">Серпень 2026</span>
                        <button onclick="changeCalendarMonth(1)" class="p-1 hover:bg-slate-100 rounded-lg font-bold">&rarr;</button>
                    </div>
                    <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400 mb-1">
                        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Нд</span>
                    </div>
                    <div id="calendarDaysGrid" class="grid grid-cols-7 gap-1 text-center text-xs"></div>
                </div>
            </div>

            <div>
                <a href="index.html" class="text-blue-600 hover:underline mr-4">Головна</a>
                <a href="analytics.html" class="text-gray-800 font-semibold">Аналітика</a>
            </div>
        </div>
    </nav>

    <div class="executive-container space-y-4" id="dashboardContent">
        
        <!-- Панель мультиселектів статей -->
        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 flex flex-wrap gap-6 items-center justify-between print-hide">
            <div class="flex flex-wrap gap-4 items-center">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-600 uppercase">Доходи:</label>
                    <select id="inflowMode" onchange="onInflowModeChange()" class="border border-slate-300 rounded px-2 py-1 text-xs bg-white">
                        <option value="all">Всі статті (Сума)</option>
                        <option value="custom">Обрані статті</option>
                    </select>
                </div>
                <div id="inflowCustomContainer" class="hidden flex flex-wrap items-center gap-3 bg-white p-2 border rounded text-xs">
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Нафта" checked onchange="updateChartAndTable()"> Нафта</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Газ природній" checked onchange="updateChartAndTable()"> Газ</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Нафтопродукти ОПТ" checked onchange="updateChartAndTable()"> Нафтопродукти ОПТ</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Нафтопродукти АОЗ" checked onchange="updateChartAndTable()"> Нафтопродукти АОЗ</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Нафтопродукти роздріб АЗС" checked onchange="updateChartAndTable()"> Нафтопродукти роздріб АЗС</label>
                </div>
            </div>

            <div class="flex flex-wrap gap-4 items-center">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-600 uppercase">Видатки:</label>
                    <select id="outflowMode" onchange="onOutflowModeChange()" class="border border-slate-300 rounded px-2 py-1 text-xs bg-white">
                        <option value="all">Всі статті (Сума)</option>
                        <option value="custom">Обрані статті</option>
                    </select>
                </div>
                <div id="outflowCustomContainer" class="hidden flex flex-wrap items-center gap-3 bg-white p-2 border rounded text-xs">
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Комерційний оборотний капітал" checked onchange="updateChartAndTable()"> Оборотний капітал</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Обов’язкові платежі" checked onchange="updateChartAndTable()"> Обов’язкові платежі</label>
                </div>
            </div>
        </div>

        <!-- Графіки -->
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-3 rounded-lg border border-slate-200">
                <h3 class="text-center font-bold text-xs text-slate-700 mb-2">ВСЬОГО Доходи та Витрати, млн грн</h3>
                <div class="relative h-64">
                    <canvas id="trendChartOverall"></canvas>
                </div>
            </div>
            <div class="bg-white p-3 rounded-lg border border-slate-200">
                <h3 class="text-center font-bold text-xs text-slate-700 mb-2">Обрані Доходи та Витрати (Деталізація), млн грн</h3>
                <div class="relative h-64">
                    <canvas id="trendChartCustom"></canvas>
                </div>
            </div>
        </div>

        <!-- Таблиця -->
        <div class="bg-white p-3 rounded-lg border border-slate-200 overflow-x-auto">
            <h3 class="font-bold text-xs text-slate-700 mb-2">Таблиця. Структура (Історія з хмари + Прогноз)</h3>
            <table class="exec-table" id="structTable">
                <thead><tr id="tableHeadRow"></tr></thead>
                <tbody id="tableBodyRows"></tbody>
            </table>
        </div>
    </div>

    <script>
        const GET_METRICS_FLOW_URL = "https://defaultce629f5605df43c6b9798b0b7992fc.55.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/28/workflows/76596625557146c6882e837e2fb46961/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=mWBVsXd5FLyjoME7JGEBX1Zo4zfdQKt1Fi46spXVdFU";

        let chartOverall = null, chartCustom = null;
        const labels = ["Т-4", "Т-3", "Т-2", "Т-1", "Т0", "Т1", "Т2", "Т3", "Т4", "Т5", "Т6", "Т7", "Т8", "Т9", "Т10", "Т11", "Т12"];
        let periodRanges = Array(17).fill("");

        let currentReportDate = "2026-08-24";
        let calViewDate = new Date(2026, 7, 24);

        let activeCloudModel = {
            inflows: {
                "Нафта": { history: Array(4).fill(0), forecast: Array(13).fill(0) },
                "Газ природній": { history: Array(4).fill(0), forecast: Array(13).fill(0) },
                "Нафтопродукти ОПТ": { history: Array(4).fill(0), forecast: Array(13).fill(0) },
                "Нафтопродукти АОЗ": { history: Array(4).fill(0), forecast: Array(13).fill(0) },
                "Нафтопродукти роздріб АЗС": { history: Array(4).fill(0), forecast: Array(13).fill(0) }
            },
            outflows: {
                "Комерційний оборотний капітал": { history: Array(4).fill(0), forecast: Array(13).fill(0) },
                "Обов’язкові платежі": { history: Array(4).fill(0), forecast: Array(13).fill(0) }
            }
        };

        const shortNamesMap = {
            "Нафта": "НФ",
            "Газ природній": "ГП",
            "Нафтопродукти ОПТ": "ОПТ",
            "Нафтопродукти АОЗ": "АОЗ",
            "Нафтопродукти роздріб АЗС": "АЗС",
            "Комерційний оборотний капітал": "КОБ",
            "Обов’язкові платежі": "ОП"
        };

        function formatNum(val) {
            if (val == null || isNaN(val)) return '-';
            return Math.round(Number(val)).toLocaleString('uk-UA', { maximumFractionDigits: 0 }).replace(/\u202F/g, ' ');
        }

        function sumArrays(arrays) {
            if (!arrays.length) return Array(labels.length).fill(0);
            return arrays[0].map((_, colIdx) => arrays.reduce((sum, arr) => sum + (arr[colIdx] || 0), 0));
        }

        function findNodeInTree(nodes, targetName) {
            if (!nodes || !nodes.length) return null;
            const target = targetName.trim().toLowerCase();
            for (const node of nodes) {
                const name = (node.name || "").trim().toLowerCase();
                if (name === target || name.includes(target)) return node;
                if (node.children && node.children.length > 0) {
                    const found = findNodeInTree(node.children, targetName);
                    if (found) return found;
                }
            }
            return null;
        }

        function calculateDateRanges(anchorIsoDate) {
            const parts = String(anchorIsoDate).split('-').map(Number);
            if (parts.length !== 3 || parts.some(isNaN)) return;
            const [y, m, d] = parts;
            const anchorDate = new Date(y, m - 1, d);

            const formatDateStr = (dateObj) => {
                const dd = String(dateObj.getDate()).padStart(2, '0');
                const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
                return `${dd}.${mm}`;
            };

            for (let i = 0; i < 4; i++) {
                const weeksBefore = 4 - i;
                const sunday = new Date(anchorDate);
                sunday.setDate(anchorDate.getDate() - weeksBefore * 7 + 6);
                periodRanges[i] = formatDateStr(sunday);
            }

            for (let i = 0; i < 13; i++) {
                const sunday = new Date(anchorDate);
                sunday.setDate(anchorDate.getDate() + i * 7 + 6);
                periodRanges[4 + i] = formatDateStr(sunday);
            }
        }

        function getHistoricalDates(isoDate) {
            const parts = String(isoDate).split('-').map(Number);
            if (parts.length !== 3 || parts.some(isNaN)) return [isoDate];
            const [y, m, d] = parts;
            const out = [];
            for (let i = 1; i <= 4; i++) {
                const dt = new Date(y, m - 1, d - i * 7);
                const yy = dt.getFullYear();
                const mm = String(dt.getMonth() + 1).padStart(2, '0');
                const dd = String(dt.getDate()).padStart(2, '0');
                out.push(`${yy}-${mm}-${dd}`);
            }
            return out.reverse();
        }

        async function loadFullAnalyticsModel(selectedDateIso) {
            const statusEl = document.getElementById('dataStatus');
            statusEl.textContent = "Завантаження з хмари...";
            statusEl.className = "text-xs font-medium px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-800";

            calculateDateRanges(selectedDateIso);

            try {
                const histDates = getHistoricalDates(selectedDateIso);

                const historySnapshots = await Promise.all(
                    histDates.map(async (iso) => {
                        try {
                            const res = await fetch(GET_METRICS_FLOW_URL, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ reportDate: iso, reportDateDot: iso.split('-').reverse().join('.') })
                            });
                            if (!res.ok) return null;
                            const json = await res.json();
                            return json.snapshot || json;
                        } catch (e) { return null; }
                    })
                );

                const mainRes = await fetch(GET_METRICS_FLOW_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reportDate: selectedDateIso, reportDateDot: selectedDateIso.split('-').reverse().join('.') })
                });
                if (!mainRes.ok) throw new Error("Не вдалося отримати основний зріз.");
                const mainJson = await mainRes.json();
                const mainSnap = mainJson.snapshot || mainJson;
                const mainTree = mainSnap.tree || [];

                const inflowNames = Object.keys(activeCloudModel.inflows);
                const outflowNames = Object.keys(activeCloudModel.outflows);
                const forecastCols = ["T0", "T1", "T2", "T3", "T4", "T5", "T6", "T7", "T8", "T9", "T10", "T11", "T12"];

                inflowNames.forEach(name => {
                    const histArr = historySnapshots.map(snap => {
                        if (!snap || !snap.tree) return 0;
                        const n = findNodeInTree(snap.tree, name);
                        return n && n.values ? Math.round((n.values.Tm1_fact || n.values.Tm1_plan || 0) / 1000000) : 0;
                    });

                    const mainNode = findNodeInTree(mainTree, name);
                    const foreArr = forecastCols.map(col => mainNode && mainNode.values ? Math.round((mainNode.values[col] || 0) / 1000000) : 0);

                    activeCloudModel.inflows[name] = { history: histArr, forecast: foreArr };
                });

                outflowNames.forEach(name => {
                    const histArr = historySnapshots.map(snap => {
                        if (!snap || !snap.tree) return 0;
                        const n = findNodeInTree(snap.tree, name);
                        return n && n.values ? Math.round((n.values.Tm1_fact || n.values.Tm1_plan || 0) / 1000000) : 0;
                    });

                    const mainNode = findNodeInTree(mainTree, name);
                    const foreArr = forecastCols.map(col => mainNode && mainNode.values ? Math.round((mainNode.values[col] || 0) / 1000000) : 0);

                    activeCloudModel.outflows[name] = { history: histArr, forecast: foreArr };
                });

                updateChartAndTable();
                statusEl.textContent = "Дані успішно оновлено з хмари";
                statusEl.className = "text-xs font-medium px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800";
            } catch (err) {
                console.error("Помилка хмари:", err);
                statusEl.textContent = "Помилка зв'язку з хмарою";
                statusEl.className = "text-xs font-medium px-2.5 py-1 rounded-full bg-red-100 text-red-800";
            }
        }

        function getFullArray(objMap, keysList) {
            const res = Array(17).fill(0);
            keysList.forEach(k => {
                const item = objMap[k];
                if (!item) return;
                for (let i = 0; i < 4; i++) res[i] += (item.history[i] || 0);
                for (let i = 0; i < item.forecast.length; i++) res[4 + i] += (item.forecast[i] || 0);
            });
            return res;
        }

        function onInflowModeChange() {
            document.getElementById('inflowCustomContainer').classList.toggle('hidden', document.getElementById('inflowMode').value === 'all');
            updateChartAndTable();
        }

        function onOutflowModeChange() {
            document.getElementById('outflowCustomContainer').classList.toggle('hidden', document.getElementById('outflowMode').value === 'all');
            updateChartAndTable();
        }

        function getSelectedKeys(type) {
            const mode = document.getElementById(type + 'Mode').value;
            const container = document.getElementById(type + 'CustomContainer');
            const checkboxes = container.querySelectorAll('input[type="checkbox"]');
            let selected = [];
            checkboxes.forEach(cb => {
                if (mode === 'all' || cb.checked) selected.push(cb.value);
            });
            return selected;
        }

        function updateChartAndTable() {
            const selInf = getSelectedKeys('inflow');
            const selOut = getSelectedKeys('outflow');

            const totalInflows = sumArrays(Object.values(activeCloudModel.inflows).map(x => [...x.history, ...x.forecast]));
            const totalOutflows = sumArrays(Object.values(activeCloudModel.outflows).map(x => [...x.history, ...x.forecast]));

            const customInflows = getFullArray(activeCloudModel.inflows, selInf);
            const customOutflows = getFullArray(activeCloudModel.outflows, selOut);

            renderCharts(totalInflows, totalOutflows, customInflows, customOutflows);
            renderTable(selInf, selOut, totalInflows, totalOutflows);
        }

        function renderCharts(totInf, totOut, custInf, custOut) {
            const opt = {
                responsive: true, maintainAspectRatio: false,
                devicePixelRatio: 3, // Підвищена роздільна здатність графіків для чіткого PDF
                scales: { y: { beginAtZero: true } },
                plugins: { legend: { position: 'top', labels: { boxWidth: 12 } } }
            };

            if (chartOverall) chartOverall.destroy();
            chartOverall = new Chart(document.getElementById('trendChartOverall').getContext('2d'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Доходи', data: totInf, borderColor: '#0f766e', borderWidth: 2, fill: false, tension: 0.1 },
                        { label: 'Видатки', data: totOut, borderColor: '#ea580c', borderWidth: 2, fill: false, tension: 0.1 }
                    ]
                },
                options: opt
            });

            if (chartCustom) chartCustom.destroy();
            chartCustom = new Chart(document.getElementById('trendChartCustom').getContext('2d'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Доходи (обр.)', data: custInf, borderColor: '#0f766e', borderWidth: 2, fill: false, tension: 0.1 },
                        { label: 'Видатки (обр.)', data: custOut, borderColor: '#ea580c', borderWidth: 2, fill: false, tension: 0.1 }
                    ]
                },
                options: opt
            });
        }

        function renderTable(selInf, selOut, totInf, totOut) {
            const headRow = document.getElementById('tableHeadRow');
            headRow.innerHTML = '<th class="px-3 py-2 text-left font-medium">Показник / Стаття</th>' + labels.map((l, idx) => `<th class="px-1 py-2 text-right">${l}<span class="th-period">${periodRanges[idx]}</span></th>`).join('');

            const customInflows = getFullArray(activeCloudModel.inflows, selInf);
            const customOutflows = getFullArray(activeCloudModel.outflows, selOut);

            const netTotal = totInf.map((inf, idx) => inf - totOut[idx]);
            const shortInfNames = selInf.map(k => shortNamesMap[k] || k).join(', ');
            const shortOutNames = selOut.map(k => shortNamesMap[k] || k).join(', ');
            const netCustom = customInflows.map((inf, idx) => inf - customOutflows[idx]);

            // Кольори для чистого потоку (inline-стилі гарантують коректне відображення у PDF)
            const POS_COLOR = '#047857'; // зелений (emerald-700)
            const NEG_COLOR = '#b91c1c'; // червоний (red-700)
            const netCellStyle = (v) => `color: ${v >= 0 ? POS_COLOR : NEG_COLOR}; font-weight: 700;`;

            let html = '';
            
            // 1. Доходи всього
            html += `<tr class="bg-emerald-50 font-bold"><td class="px-3 py-2">Надходження всього</td>${totInf.map(v => `<td class="px-2 py-2 text-right">${formatNum(v)}</td>`).join('')}</tr>`;

            // Деталізація доходів
            Object.keys(activeCloudModel.inflows).forEach(k => {
                const isSel = selInf.includes(k);
                const item = activeCloudModel.inflows[k];
                const fullArr = [...item.history, ...item.forecast];
                html += `<tr class="${isSel ? 'bg-white' : 'opacity-40'} text-xs">
                    <td class="px-3 py-1.5 pl-6">${k}</td>
                    ${fullArr.map(v => `<td class="px-2 py-1.5 text-right">${formatNum(v)}</td>`).join('')}
                </tr>`;
            });

            // 2. Видатки всього
            html += `<tr class="bg-orange-50 font-bold border-t-2"><td class="px-3 py-2">Видатки всього</td>${totOut.map(v => `<td class="px-2 py-2 text-right">${formatNum(v)}</td>`).join('')}</tr>`;

            // Деталізація видатків
            Object.keys(activeCloudModel.outflows).forEach(k => {
                const isSel = selOut.includes(k);
                const item = activeCloudModel.outflows[k];
                const fullArr = [...item.history, ...item.forecast];
                html += `<tr class="${isSel ? 'bg-white' : 'opacity-40'} text-xs">
                    <td class="px-3 py-1.5 pl-6">${k}</td>
                    ${fullArr.map(v => `<td class="px-2 py-1.5 text-right">${formatNum(v)}</td>`).join('')}
                </tr>`;
            });

            // 3. Чистий потік всього — зелений/червоний шрифт залежно від знаку
            html += `<tr class="bg-slate-200 font-bold text-slate-900 border-t-2">
                <td class="px-3 py-2">Чистий потік (Доходи - Видатки)</td>
                ${netTotal.map(v => `<td class="px-2 py-2 text-right" style="${netCellStyle(v)}">${formatNum(v)}</td>`).join('')}
            </tr>`;

            // 4. Чистий потік (обрані) — зелений/червоний шрифт залежно від знаку
            html += `<tr class="bg-slate-100 font-bold text-slate-800 border-t">
                <td class="px-3 py-2">ЧП (${shortInfNames}) - (${shortOutNames})</td>
                ${netCustom.map(v => `<td class="px-2 py-2 text-right" style="${netCellStyle(v)}">${formatNum(v)}</td>`).join('')}
            </tr>`;

            document.getElementById('tableBodyRows').innerHTML = html;
        }

        function generatePDF() {
            window.scrollTo(0, 0);

            // 1. Приховуємо панелі вибору статей та інші службові елементи (.print-hide) на час формування PDF
            const hiddenEls = document.querySelectorAll('#dashboardContent .print-hide');
            hiddenEls.forEach(el => el.classList.add('pdf-hidden'));
            const restore = () => hiddenEls.forEach(el => el.classList.remove('pdf-hidden'));

            // 2. Підвищена чіткість: більший scale, letterRendering та фіксована ширина рендеру
            html2pdf().set({
                margin: [4, 4, 4, 4],
                filename: `Analytics_CashFlow.pdf`,
                image: { type: 'png', quality: 1 },
                html2canvas: {
                    scale: 4,
                    dpi: 300,
                    useCORS: true,
                    backgroundColor: '#ffffff',
                    logging: false,
                    letterRendering: true,
                    windowWidth: 1780,
                    scrollX: 0,
                    scrollY: 0
                },
                jsPDF: { unit: 'mm', format: 'a3', orientation: 'landscape', compress: true }
            }).from(document.getElementById('dashboardContent')).save().then(restore).catch(restore);
        }

        // Календар
        function toggleCalendarDropdown() { document.getElementById('calendarDropdown').classList.toggle('hidden'); renderCalendar(); }
        function changeCalendarMonth(d) { calViewDate.setMonth(calViewDate.getMonth() + d); renderCalendar(); }
        
        function renderCalendar() {
            const y = calViewDate.getFullYear(), m = calViewDate.getMonth();
            const monthNames = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];
            document.getElementById('calendarMonthYear').innerText = `${monthNames[m]} ${y}`;
            
            const grid = document.getElementById('calendarDaysGrid');
            grid.innerHTML = '';
            let firstDay = new Date(y, m, 1).getDay() - 1; if (firstDay === -1) firstDay = 6;
            const daysCount = new Date(y, m + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) grid.innerHTML += `<span></span>`;
            for (let day = 1; day <= daysCount; day++) {
                const dStr = String(day).padStart(2, '0');
                const mStr = String(m + 1).padStart(2, '0');
                const dateKey = `${y}-${mStr}-${dStr}`;
                const isSel = currentReportDate === dateKey;

                grid.innerHTML += `<button onclick="selectDate('${dateKey}')" class="py-1 rounded text-xs font-semibold ${isSel ? 'bg-indigo-600 text-white' : 'hover:bg-slate-100'}">${day}</button>`;
            }
        }

        function selectDate(iso) {
            currentReportDate = iso;
            const [y, m, d] = iso.split('-');
            document.getElementById('lblSelectedDate').innerText = `${d}.${m}.${y}`;
            document.getElementById('headerReportDate').innerText = `${d}.${m}.${y}`;
            document.getElementById('calendarDropdown').classList.add('hidden');
            loadFullAnalyticsModel(iso);
        }

        document.addEventListener('DOMContentLoaded', () => {
            selectDate("2026-08-24");
        });
    </script>
</body>
</html>
