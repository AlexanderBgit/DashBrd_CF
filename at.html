<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Cash Flow Dashboard - Аналітика</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Helvetica', sans-serif; background-color: #f3f4f6; color: #334155; }
        .executive-container { max-width: 1587px; margin: 0 auto; background-color: #ffffff; padding: 25px 30px; box-sizing: border-box; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .exec-table { width: 100%; border-collapse: collapse; font-size: 9.5pt; }
        .exec-table th { font-size: 9.5pt; color: #64748b; font-weight: 600; padding: 4px 6px; border-bottom: 1.5px solid #94a3b8; text-align: right; background-color: #f8fafc; }
        .exec-table th:first-child { text-align: left; }
        .exec-table td { padding: 3px 6px; text-align: right; color: #334155; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
        .exec-table td:first-child { text-align: left; font-weight: 500; white-space: nowrap; }
    </style>
</head>
<body class="p-4">

    <!-- Верхня панель керування та вибору дати -->
    <nav class="bg-white shadow p-4 mb-6 rounded-lg max-w-[1587px] mx-auto flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-slate-800">Executive Cash Flow Dashboard — Аналітика</h1>
            <p class="text-xs text-slate-500 mt-0.5">Звітна дата зрізу: <span id="headerReportDate" class="font-semibold text-indigo-600">24.08.2026</span></p>
        </div>
        <div class="flex items-center gap-4">
            <!-- Інтерактивний вибір дати (Календар) -->
            <div class="relative">
                <button onclick="toggleCalendarDropdown()" id="btnCalendarTrigger" class="bg-slate-100 hover:bg-slate-200 text-slate-800 px-3.5 py-1.5 rounded-full font-bold text-xs flex items-center gap-2 border border-slate-300 cursor-pointer">
                    <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span id="lblSelectedDate">24.08.2026</span>
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                </button>
                <div id="calendarDropdown" class="absolute top-11 right-0 bg-white border border-slate-200 rounded-2xl shadow-2xl p-4 w-72 hidden z-50">
                    <div class="flex justify-between items-center mb-3">
                        <button onclick="changeCalendarMonth(-1)" class="p-1 hover:bg-slate-100 rounded-lg font-bold">&larr;</button>
                        <span id="calendarMonthYear" class="font-bold text-xs text-slate-800 uppercase">Серпень 2026</span>
                        <button onclick="changeCalendarMonth(1)" class="p-1 hover:bg-slate-100 rounded-lg font-bold">&rarr;</button>
                    </div>
                    <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400 mb-1">
                        <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Нд</span>
                    </div>
                    <div id="calendarDaysGrid" class="grid grid-cols-7 gap-1 text-center text-xs"></div>
                </div>
            </div>

            <div>
                <a href="index.html" class="text-blue-600 hover:underline mr-4">Головна</a>
                <a href="analytics.html" class="text-gray-800 font-semibold">Аналітика</a>
            </div>
        </div>
    </nav>

    <div class="executive-container space-y-6">
        
        <!-- Панель мультиселектів статей -->
        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 flex flex-wrap gap-6 items-center justify-between">
            <div class="flex flex-wrap gap-4 items-center">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-600 uppercase">Доходи:</label>
                    <select id="inflowMode" onchange="onInflowModeChange()" class="border border-slate-300 rounded px-2 py-1 text-xs bg-white">
                        <option value="all">Всі статті (Сума)</option>
                        <option value="custom">Обрані статті</option>
                    </select>
                </div>
                <div id="inflowCustomContainer" class="hidden flex flex-wrap items-center gap-3 bg-white p-2 border rounded text-xs">
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Нафта" checked onchange="updateChartAndTable()"> Нафта</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Газ природній" checked onchange="updateChartAndTable()"> Газ природній</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Нафтопродукти ОПТ" checked onchange="updateChartAndTable()"> Нафтопродукти ОПТ</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Нафтопродукти АОЗ" checked onchange="updateChartAndTable()"> Нафтопродукти АОЗ</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Нафтопродукти роздріб АЗС" checked onchange="updateChartAndTable()"> Нафтопродукти роздріб АЗС</label>
                </div>
            </div>

            <div class="flex flex-wrap gap-4 items-center">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-600 uppercase">Видатки:</label>
                    <select id="outflowMode" onchange="onOutflowModeChange()" class="border border-slate-300 rounded px-2 py-1 text-xs bg-white">
                        <option value="all">Всі статті (Сума)</option>
                        <option value="custom">Обрані статті</option>
                    </select>
                </div>
                <div id="outflowCustomContainer" class="hidden flex flex-wrap items-center gap-3 bg-white p-2 border rounded text-xs">
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Комерційний оборотний капітал" checked onchange="updateChartAndTable()"> Комерційний оборотний капітал</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Обов’язкові платежі" checked onchange="updateChartAndTable()"> Обов’язкові платежі</label>
                </div>
            </div>
        </div>

        <!-- Графіки відповідно до зразка -->
        <div class="grid grid-cols-2 gap-6">
            <div class="bg-white p-4 rounded-lg border border-slate-200">
                <h3 class="text-center font-bold text-sm text-slate-700 mb-3">ВСЬОГО Доходи та Витрати, млн грн</h3>
                <div class="relative h-72">
                    <canvas id="trendChartOverall"></canvas>
                </div>
            </div>
            <div class="bg-white p-4 rounded-lg border border-slate-200">
                <h3 class="text-center font-bold text-sm text-slate-700 mb-3">Обрані Доходи та Витрати (Деталізація), млн грн</h3>
                <div class="relative h-72">
                    <canvas id="trendChartCustom"></canvas>
                </div>
            </div>
        </div>

        <!-- ТаблицяСтруктура -->
        <div class="bg-white p-4 rounded-lg border border-slate-200 overflow-x-auto">
            <h3 class="font-bold text-sm text-slate-700 mb-2">Таблиця. Структура</h3>
            <table class="exec-table" id="structTable">
                <thead><tr id="tableHeadRow"></tr></thead>
                <tbody id="tableBodyRows"></tbody>
            </table>
        </div>
    </div>

    <script>
        const GET_METRICS_FLOW_URL = "https://defaultce629f5605df43c6b9798b0b7992fc.55.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/28/workflows/76596625557146c6882e837e2fb46961/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=mWBVsXd5FLyjoME7JGEBX1Zo4zfdQKt1Fi46spXVdFU";

        let chartOverall = null, chartCustom = null;
        const labels = ["Т-4", "Т-3", "Т-2", "Т-1", "Т0", "Т1", "Т2", "Т3", "Т4", "Т5", "Т6", "Т7", "Т8", "Т9", "Т10", "Т11", "Т12"];

        let currentReportDate = "2026-08-24";
        let availableDatesWithData = ["2026-08-10", "2026-08-17", "2026-08-24"];
        let calViewDate = new Date(2026, 7, 24);

        let activeCloudModel = {
            inflows: {
                "Нафта": [40, 42, 45, 46, 2069, 919, 904, 0, 0, 588, 86, 615, 124, 272, 718, 0, 391],
                "Газ природній": [0, 0, 0, 42, 751, 240, 240, 240, 168, 0, 250, 250, 250, 250, 250, 250, 250],
                "Нафтопродукти ОПТ": [1700, 1750, 1800, 1814, 1894, 1801, 1622, 1622, 1622, 1622, 1562, 1562, 1562, 1562, 1571, 1571, 1571],
                "Нафтопродукти АОЗ": [500, 520, 600, 703, 504, 938, 938, 938, 938, 938, 908, 908, 908, 908, 1502, 1502, 1502],
                "Нафтопродукти роздріб АЗС": [1000, 1020, 1030, 1037, 1098, 1098, 1046, 1046, 1046, 1046, 998, 998, 998, 998, 998, 998, 998]
            },
            outflows: {
                "Комерційний оборотний капітал": [2100, 2200, 2150, 2160, 5338, 2382, 1308, 3846, 2365, 2840, 2155, 3274, 3737, 1838, 3779, 2572, 3198],
                "Обов’язкові платежі": [2000, 2050, 2080, 2096, 174, 1539, 665, 107, 544, 1586, 674, 68, 494, 1625, 796, 84, 1516]
            }
        };

        function formatNum(val) {
            if (val == null || isNaN(val)) return '-';
            return Math.round(Number(val)).toLocaleString('uk-UA', { maximumFractionDigits: 0 }).replace(/\u202F/g, ' ');
        }

        function sumArrays(arrays) {
            if (!arrays.length) return Array(labels.length).fill(0);
            return arrays[0].map((_, colIdx) => arrays.reduce((sum, arr) => sum + (arr[colIdx] || 0), 0));
        }

        function findNodeInTree(nodes, targetName) {
            if (!nodes || !nodes.length) return null;
            const target = targetName.trim().toLowerCase();
            for (const node of nodes) {
                const name = (node.name || "").trim().toLowerCase();
                if (name === target || name.includes(target)) return node;
                if (node.children && node.children.length > 0) {
                    const found = findNodeInTree(node.children, targetName);
                    if (found) return found;
                }
            }
            return null;
        }

        function extractValuesArray(node) {
            if (!node || !node.values) return Array(17).fill(0);
            const v = node.values;
            // Порядок колонок: Tm4, Tm3, Tm2, Tm1, T0 ... T12
            const keys = ["Tm4_fact", "Tm3_fact", "Tm2_fact", "Tm1_fact", "T0", "T1", "T2", "T3", "T4", "T5", "T6", "T7", "T8", "T9", "T10", "T11", "T12"];
            return keys.map(k => Math.round((v[k] || 0) / 1000000));
        }

        async function loadCloudData(dateStr) {
            try {
                const res = await fetch(GET_METRICS_FLOW_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reportDate: dateStr })
                });
                if (!res.ok) throw new Error("HTTP " + res.status);
                const json = await res.json();
                const snap = json.snapshot || json;

                if (snap && snap.tree) {
                    const tree = snap.tree;
                    const infNames = Object.keys(activeCloudModel.inflows);
                    const outNames = Object.keys(activeCloudModel.outflows);

                    infNames.forEach(name => {
                        const n = findNodeInTree(tree, name);
                        if (n) activeCloudModel.inflows[name] = extractValuesArray(n);
                    });
                    outNames.forEach(name => {
                        const n = findNodeInTree(tree, name);
                        if (n) activeCloudModel.outflows[name] = extractValuesArray(n);
                    });
                }
            } catch (e) {
                console.warn("Працює у локальному режимі демонстрації даних:", e);
            }
            updateChartAndTable();
        }

        function onInflowModeChange() {
            document.getElementById('inflowCustomContainer').classList.toggle('hidden', document.getElementById('inflowMode').value === 'all');
            updateChartAndTable();
        }

        function onOutflowModeChange() {
            document.getElementById('outflowMode').value;
            document.getElementById('outflowCustomContainer').classList.toggle('hidden', document.getElementById('outflowMode').value === 'all');
            updateChartAndTable();
        }

        function getSelectedKeys(type) {
            const mode = document.getElementById(type + 'Mode').value;
            const container = document.getElementById(type + 'CustomContainer');
            const checkboxes = container.querySelectorAll('input[type="checkbox"]');
            let selected = [];
            checkboxes.forEach(cb => {
                if (mode === 'all' || cb.checked) selected.push(cb.value);
            });
            return selected;
        }

        function updateChartAndTable() {
            const selInf = getSelectedKeys('inflow');
            const selOut = getSelectedKeys('outflow');

            const totalInflows = sumArrays(Object.values(activeCloudModel.inflows));
            const totalOutflows = sumArrays(Object.values(activeCloudModel.outflows));

            const customInflows = sumArrays(selInf.map(k => activeCloudModel.inflows[k]));
            const customOutflows = sumArrays(selOut.map(k => activeCloudModel.outflows[k]));

            renderCharts(totalInflows, totalOutflows, customInflows, customOutflows);
            renderTable(selInf, selOut, totalInflows, totalOutflows);
        }

        // Рендеринг діаграм відповідно до твого зразка (Кольори: Доходи — бірюзовий/зеленуватий, Видатки — помаранчевий)
        function renderCharts(totInf, totOut, custInf, custOut) {
            const opt = {
                responsive: true, maintainAspectRatio: false,
                scales: { y: { beginAtZero: true } },
                plugins: { legend: { position: 'top', labels: { boxWidth: 12 } } }
            };

            if (chartOverall) chartOverall.destroy();
            chartOverall = new Chart(document.getElementById('trendChartOverall').getContext('2d'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Доходи', data: totInf, borderColor: '#0f766e', borderWidth: 2, fill: false, tension: 0.1 },
                        { label: 'Видатки', data: totOut, borderColor: '#ea580c', borderWidth: 2, fill: false, tension: 0.1 }
                    ]
                },
                options: opt
            });

            if (chartCustom) chartCustom.destroy();
            chartCustom = new Chart(document.getElementById('trendChartCustom').getContext('2d'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Доходи НП (обр.)', data: custInf, borderColor: '#0f766e', borderWidth: 2, fill: false, tension: 0.1 },
                        { label: 'Видатки НП (обр.)', data: custOut, borderColor: '#ea580c', borderWidth: 2, fill: false, tension: 0.1 }
                    ]
                },
                options: opt
            });
        }

        function renderTable(selInf, selOut, totInf, totOut) {
            const headRow = document.getElementById('tableHeadRow');
            headRow.innerHTML = '<th class="px-3 py-2 text-left font-medium">Показник / Стаття</th>' + labels.map(l => `<th class="px-2 py-2 text-right">${l}</th>`).join('');

            let html = '';
            html += `<tr class="bg-emerald-50 font-bold"><td class="px-3 py-2">Надходження всього</td>${totInf.map(v => `<td class="px-2 py-2 text-right">${formatNum(v)}</td>`).join('')}</tr>`;

            Object.keys(activeCloudModel.inflows).forEach(k => {
                const isSel = selInf.includes(k);
                const arr = activeCloudModel.inflows[k];
                html += `<tr class="${isSel ? 'bg-white' : 'opacity-40'} text-xs">
                    <td class="px-3 py-1.5 pl-6">${k}</td>
                    ${arr.map(v => `<td class="px-2 py-1.5 text-right">${formatNum(v)}</td>`).join('')}
                </tr>`;
            });

            html += `<tr class="bg-orange-50 font-bold border-t-2"><td class="px-3 py-2">Видатки всього</td>${totOut.map(v => `<td class="px-2 py-2 text-right">${formatNum(v)}</td>`).join('')}</tr>`;

            Object.keys(activeCloudModel.outflows).forEach(k => {
                const isSel = selOut.includes(k);
                const arr = activeCloudModel.outflows[k];
                html += `<tr class="${isSel ? 'bg-white' : 'opacity-40'} text-xs">
                    <td class="px-3 py-1.5 pl-6">${k}</td>
                    ${arr.map(v => `<td class="px-2 py-1.5 text-right">${formatNum(v)}</td>`).join('')}
                </tr>`;
            });

            document.getElementById('tableBodyRows').innerHTML = html;
        }

        // Логіка календаря
        function toggleCalendarDropdown() { document.getElementById('calendarDropdown').classList.toggle('hidden'); renderCalendar(); }
        function changeCalendarMonth(d) { calViewDate.setMonth(calViewDate.getMonth() + d); renderCalendar(); }
        
        function renderCalendar() {
            const y = calViewDate.getFullYear(), m = calViewDate.getMonth();
            const monthNames = ["Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень", "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"];
            document.getElementById('calendarMonthYear').innerText = `${monthNames[m]} ${y}`;
            
            const grid = document.getElementById('calendarDaysGrid');
            grid.innerHTML = '';
            let firstDay = new Date(y, m, 1).getDay() - 1; if (firstDay === -1) firstDay = 6;
            const daysCount = new Date(y, m + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) grid.innerHTML += `<span></span>`;
            for (let day = 1; day <= daysCount; day++) {
                const dStr = String(day).padStart(2, '0');
                const mStr = String(m + 1).padStart(2, '0');
                const dateKey = `${y}-${mStr}-${dStr}`;
                const isSel = currentReportDate === dateKey;

                grid.innerHTML += `<button onclick="selectDate('${dateKey}')" class="py-1 rounded text-xs font-semibold ${isSel ? 'bg-indigo-600 text-white' : 'hover:bg-slate-100'}">${day}</button>`;
            }
        }

        function selectDate(iso) {
            currentReportDate = iso;
            document.getElementById('lblSelectedDate').innerText = iso.split('-').reverse().join('.');
            document.getElementById('headerReportDate').innerText = iso.split('-').reverse().join('.');
            document.getElementById('calendarDropdown').classList.add('hidden');
            loadCloudData(iso);
        }

        document.addEventListener('DOMContentLoaded', () => {
            selectDate("2026-08-24");
        });
    </script>
</body>
</html>
