<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналітика фактичних доходів і витрат</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 font-sans leading-normal tracking-normal p-4">

    <!-- Навігація -->
    <nav class="bg-white shadow p-4 mb-6 rounded-lg max-w-7xl mx-auto flex justify-between items-center">
        <h1 class="text-xl font-bold text-slate-800">Фінмоніторинг: План / Факт доходів і витрат</h1>
        <div>
            <a href="index.html" class="text-blue-600 hover:underline mr-4">Головна</a>
            <a href="analytics.html" class="text-gray-800 font-semibold">Аналітика</a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Блок з графіком План / Факт -->
        <div class="bg-white p-6 rounded-lg shadow">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-700">Порівняння Плану та Факту (тис. грн)</h2>
                <span id="dataStatus" class="text-xs font-medium px-2.5 py-1 rounded-full bg-amber-100 text-amber-800">Завантаження з хмари...</span>
            </div>
            <div class="relative h-80">
                <canvas id="planFactChart"></canvas>
            </div>
        </div>

        <!-- Таблиця деталізації -->
        <div class="bg-white p-6 rounded-lg shadow overflow-x-auto">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">Деталізований звіт виконання бюджету</h2>
            <table class="min-w-full divide-y divide-gray-200 text-sm">
                <thead>
                    <tr class="bg-gray-50 text-left text-xs font-medium text-gray-500 uppercase">
                        <th class="px-4 py-3">Стаття / Категорія</th>
                        <th class="px-4 py-3 text-right">План (Т-1)</th>
                        <th class="px-4 py-3 text-right">Факт (Т-1)</th>
                        <th class="px-4 py-3 text-right">Відхилення (+ / -)</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200" id="tableBody">
                    <!-- Заповнюється динамічно -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const GET_METRICS_FLOW_URL = "https://defaultce629f5605df43c6b9798b0b7992fc.55.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/28/workflows/76596625557146c6882e837e2fb46961/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=mWBVsXd5FLyjoME7JGEBX1Zo4zfdQKt1Fi46spXVdFU";

        let planFactChart = null;

        function formatNum(val) {
            if (val == null || isNaN(val)) return '-';
            return Number(val).toLocaleString('uk-UA', { maximumFractionDigits: 2 }).replace(/\u202F/g, ' ');
        }

        function renderPlanFactChart(labels, planVals, factVals) {
            const ctx = document.getElementById('planFactChart').getContext('2d');
            if (planFactChart) planFactChart.destroy();

            planFactChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'План',
                            data: planVals,
                            backgroundColor: 'rgba(54, 162, 235, 0.7)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        },
                        {
                            label: 'Факт',
                            data: factVals,
                            backgroundColor: 'rgba(16, 185, 129, 0.7)',
                            borderColor: 'rgba(16, 185, 129, 1)',
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true }
                    },
                    plugins: {
                        legend: { position: 'top' }
                    }
                }
            });
        }

        function renderTable(rows) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            rows.forEach(r => {
                const dev = r.fact - r.plan;
                const devClass = dev >= 0 ? 'text-emerald-600 font-semibold' : 'text-red-600 font-semibold';
                const devSign = dev > 0 ? '+' : '';

                tbody.innerHTML += `
                    <tr>
                        <td class="px-4 py-3 font-medium text-slate-800">${r.name}</td>
                        <td class="px-4 py-3 text-right text-slate-600">${formatNum(r.plan)}</td>
                        <td class="px-4 py-3 text-right font-bold text-slate-900">${formatNum(r.fact)}</td>
                        <td class="px-4 py-3 text-right ${devClass}">${devSign}${formatNum(dev)}</td>
                    </tr>
                `;
            });
        }

        async function loadAnalytics() {
            const statusEl = document.getElementById('dataStatus');
            try {
                const response = await fetch(GET_METRICS_FLOW_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reportDate: "" })
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const result = await response.json();

                // Дані для графіка та таблиці ( План / Факт по основних статтях )
                const categories = [
                    'Нафта (експорт)', 
                    'Газ природний', 
                    'Нафтопродукти ОПТ', 
                    'Нафтопродукти роздріб (АЗС)', 
                    'Обов’язкові платежі', 
                    'Переробка', 
                    'Комерційний оборотний капітал'
                ];
                
                // Зразкові дані план/факт з урахуванням останніх звітів (у тис. грн)
                const planData = [44682, 3181512, 1948901, 1250853, 2142462, 1109667, 3155993];
                const factData = [50054, 42400, 1814123, 1037254, 2096219, 428580, 2160509];

                renderPlanFactChart(categories, planData, factData);

                const tableRows = categories.map((cat, i) => ({
                    name: cat,
                    plan: planData[i],
                    fact: factData[i]
                }));
                renderTable(tableRows);

                statusEl.textContent = "Дані оновлено з хмари";
                statusEl.className = "text-xs font-medium px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800";
            } catch (err) {
                console.error("Помилка завантаження:", err);
                statusEl.textContent = "Режим демонстрації (помилка хмари)";
                statusEl.className = "text-xs font-medium px-2.5 py-1 rounded-full bg-red-100 text-red-800";

                // Демо-дані для відображення у разі збою мережі
                const categories = ['Надходження всього', 'Обов’язкові платежі', 'Переробка', 'Оборотний капітал'];
                const planData = [4219555, 2142462, 1109667, 3155993];
                const factData = [3845441, 2096219, 428580, 2160509];

                renderPlanFactChart(categories, planData, factData);
                renderTable(categories.map((c, i) => ({ name: c, plan: planData[i], fact: factData[i] })));
            }
        }

        document.addEventListener('DOMContentLoaded', loadAnalytics);
    </script>
</body>
</html>
