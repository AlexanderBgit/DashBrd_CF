<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналітика доходів і витрат (План vs Факт ретроспектива)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-100 font-sans leading-normal tracking-normal p-4">

    <!-- Навігація -->
    <nav class="bg-white shadow p-4 mb-6 rounded-lg max-w-7xl mx-auto flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-slate-800">Аналітика доходів і витрат (План / Факт ретроспектива)</h1>
            <p class="text-xs text-slate-500 mt-0.5">Звітна дата зрізу: <span id="headerReportDate" class="font-semibold text-indigo-600">24.08.2026</span></p>
        </div>
        <div>
            <a href="index.html" class="text-blue-600 hover:underline mr-4">Головна</a>
            <a href="analytics.html" class="text-gray-800 font-semibold">Аналітика</a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Панель керування та вибору статей -->
        <div class="bg-white p-4 rounded-lg shadow flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-4 items-center">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-600 uppercase">Доходи:</label>
                    <select id="inflowMode" onchange="onInflowModeChange()" class="border border-slate-300 rounded px-2 py-1 text-xs bg-slate-50">
                        <option value="all">Всі статті (Сума)</option>
                        <option value="custom">Обрані статті</option>
                    </select>
                </div>
                <div id="inflowCustomContainer" class="hidden flex flex-wrap items-center gap-2 bg-slate-50 p-1.5 border rounded text-xs">
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Нафта" checked onchange="updateChartAndTable()"> Нафта</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Газ природній" checked onchange="updateChartAndTable()"> Газ</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Нафтопродукти ОПТ" checked onchange="updateChartAndTable()"> ОПТ</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Нафтопродукти АОЗ" checked onchange="updateChartAndTable()"> АОЗ</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Нафтопродукти роздріб АЗС" checked onchange="updateChartAndTable()"> АЗС</label>
                </div>
            </div>

            <div class="flex flex-wrap gap-4 items-center">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-600 uppercase">Видатки:</label>
                    <select id="outflowMode" onchange="onOutflowModeChange()" class="border border-slate-300 rounded px-2 py-1 text-xs bg-slate-50">
                        <option value="all">Всі статті (Сума)</option>
                        <option value="custom">Обрані статті</option>
                    </select>
                </div>
                <div id="outflowCustomContainer" class="hidden flex flex-wrap items-center gap-2 bg-slate-50 p-1.5 border rounded text-xs">
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Комерційний оборотний капітал" checked onchange="updateChartAndTable()"> Оборотний капітал</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="Обов’язкові платежі" checked onchange="updateChartAndTable()"> Обов'язкові платежі</label>
                </div>
            </div>
        </div>

        <!-- Блок з графіком -->
        <div class="bg-white p-6 rounded-lg shadow">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-700">Динаміка: Ретроспективний План vs Факт та Прогноз (млн грн)</h2>
                <span id="dataStatus" class="text-xs font-medium px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800">Дані готові</span>
            </div>
            <div class="relative h-96">
                <canvas id="cashFlowTrendChart"></canvas>
            </div>
        </div>

        <!-- Таблиця деталізації -->
        <div class="bg-white p-6 rounded-lg shadow overflow-x-auto">
            <h2 class="text-lg font-semibold mb-4 text-slate-700">Деталізована таблиця по періодах (План / Факт)</h2>
            <table class="min-w-full divide-y divide-gray-200 text-xs" id="dynamicTable">
                <thead>
                    <tr class="bg-gray-50 text-gray-500 uppercase" id="tableHeadRow">
                        <th class="px-3 py-2 text-left font-medium">Показник / Стаття</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200" id="tableBodyRows">
                    <!-- Заповнюється динамічно -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let trendChart = null;

        const labels = ["Т-4", "Т-3", "Т-2", "Т-1", "Т0", "Т1", "Т2", "Т3", "Т4", "Т5", "Т6", "Т7", "Т8", "Т9", "Т10", "Т11", "Т12"];

        const rawData = {
            inflows: {
                "Нафта": { plan: [42, 43, 44, 44], fact: [40, 42, 45, 46], forecast: [2069, 919, 904, 0, 0, 588, 86, 615, 124, 272, 718, 0, 391] },
                "Газ природній": { plan: [0, 0, 0, 0], fact: [0, 0, 0, 42], forecast: [751, 240, 240, 240, 168, 0, 250, 250, 250, 250, 250, 250, 250] },
                "Нафтопродукти ОПТ": { plan: [1750, 1780, 1800, 1948], fact: [1700, 1750, 1800, 1814], forecast: [1894, 1801, 1622, 1622, 1622, 1622, 1562, 1562, 1562, 1562, 1571, 1571, 1571] },
                "Нафтопродукти АОЗ": { plan: [480, 500, 504, 504], fact: [500, 520, 600, 703], forecast: [504, 938, 938, 938, 938, 938, 908, 908, 908, 908, 1502, 1502, 1502] },
                "Нафтопродукти роздріб АЗС": { plan: [1100, 1150, 1200, 1250], fact: [1000, 1020, 1030, 1037], forecast: [1098, 1098, 1046, 1046, 1046, 1046, 998, 998, 998, 998, 998, 998, 998] }
            },
            outflows: {
                "Комерційний оборотний капітал": { plan: [2200, 2300, 2500, 3155], fact: [2100, 2200, 2150, 2160], forecast: [5338, 2382, 1308, 3846, 2365, 2840, 2155, 3274, 3737, 1838, 3779, 2572, 3198] },
                "Обов’язкові платежі": { plan: [1900, 1950, 2000, 2142], fact: [2000, 2050, 2080, 2096], forecast: [174, 1539, 665, 107, 544, 1586, 674, 68, 494, 1625, 796, 84, 1516] }
            }
        };

        function formatNum(val) {
            if (val == null || isNaN(val)) return '-';
            return Number(val).toLocaleString('uk-UA', { maximumFractionDigits: 0 }).replace(/\u202F/g, ' ');
        }

        function sumObjectMetrics(objMap, keysList, subType) {
            const res = Array(labels.length).fill(0);
            keysList.forEach(k => {
                const item = objMap[k];
                if (!item) return;
                if (subType === 'history_plan') {
                    for (let i = 0; i < item.plan.length; i++) res[i] += item.plan[i];
                } else if (subType === 'history_fact') {
                    for (let i = 0; i < item.fact.length; i++) res[i] += item.fact[i];
                } else if (subType === 'forecast') {
                    for (let i = 0; i < item.forecast.length; i++) res[4 + i] += item.forecast[i];
                }
            });
            return res;
        }

        function onInflowModeChange() {
            const mode = document.getElementById('inflowMode').value;
            document.getElementById('inflowCustomContainer').classList.toggle('hidden', mode === 'all');
            updateChartAndTable();
        }

        function onOutflowModeChange() {
            const mode = document.getElementById('outflowMode').value;
            document.getElementById('outflowCustomContainer').classList.toggle('hidden', mode === 'all');
            updateChartAndTable();
        }

        function getSelectedSubItems(type) {
            const mode = document.getElementById(type + 'Mode').value;
            const container = document.getElementById(type + 'CustomContainer');
            const checkboxes = container.querySelectorAll('input[type="checkbox"]');
            let selected = [];
            checkboxes.forEach(cb => {
                if (mode === 'all' || cb.checked) selected.push(cb.value);
            });
            return selected;
        }

        function updateChartAndTable() {
            const selInf = getSelectedSubItems('inflow');
            const selOut = getSelectedSubItems('outflow');

            const allInfKeys = Object.keys(rawData.inflows);
            const allOutKeys = Object.keys(rawData.outflows);

            const infPlanHist = sumObjectMetrics(rawData.inflows, selInf, 'history_plan');
            const infPlanFore = sumObjectMetrics(rawData.inflows, selInf, 'forecast');
            const totalInfPlan = infPlanHist.map((v, idx) => v + infPlanFore[idx]);

            const infFactHist = sumObjectMetrics(rawData.inflows, selInf, 'history_fact');
            const totalInfFact = infFactHist.map((v, idx) => v + (infPlanFore[idx] || 0));

            const outPlanHist = sumObjectMetrics(rawData.outflows, selOut, 'history_plan');
            const outPlanFore = sumObjectMetrics(rawData.outflows, selOut, 'forecast');
            const totalOutPlan = outPlanHist.map((v, idx) => v + outPlanFore[idx]);

            const outFactHist = sumObjectMetrics(rawData.outflows, selOut, 'history_fact');
            const totalOutFact = outFactHist.map((v, idx) => v + (outPlanFore[idx] || 0));

            updateChart(totalInfPlan, totalInfFact, totalOutPlan, totalOutFact);
            updateTable(selInf, selOut, totalInfPlan, totalInfFact, totalOutPlan, totalOutFact);
        }

        function updateChart(infPlan, infFact, outPlan, outFact) {
            const ctx = document.getElementById('cashFlowTrendChart').getContext('2d');
            if (trendChart) trendChart.destroy();

            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Доходи (План)', data: infPlan, borderColor: '#3B82F6', borderWidth: 2, borderDash: [5, 5], fill: false },
                        { label: 'Доходи (Факт / Прогноз)', data: infFact, borderColor: '#059669', borderWidth: 3, fill: false },
                        { label: 'Видатки (План)', data: outPlan, borderColor: '#9333EA', borderWidth: 2, borderDash: [5, 5], fill: false },
                        { label: 'Видатки (Факт / Прогноз)', data: outFact, borderColor: '#DC2626', borderWidth: 3, fill: false }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } },
                    plugins: { legend: { position: 'top' } }
                }
            });
        }

        function updateTable(selInf, selOut, infPlan, infFact, outPlan, outFact) {
            const headRow = document.getElementById('tableHeadRow');
            headRow.innerHTML = '<th class="px-3 py-2 text-left font-medium">Показник / Стаття</th>' + labels.map(l => `<th class="px-2 py-2 text-right">${l}</th>`).join('');

            let html = '';

            // Загальні доходи
            html += `<tr class="bg-blue-50 font-bold text-blue-900"><td class="px-3 py-2">ДОХОДИ (ПЛАН)</td>${infPlan.map(v => `<td class="px-2 py-2 text-right">${formatNum(v)}</td>`).join('')}</tr>`;
            html += `<tr class="bg-emerald-50 font-bold text-emerald-900"><td class="px-3 py-2">ДОХОДИ (ФАКТ / ПРОГНОЗ)</td>${infFact.map(v => `<td class="px-2 py-2 text-right">${formatNum(v)}</td>`).join('')}</tr>`;

            // Деталізація по вибраних доходах
            Object.keys(rawData.inflows).forEach(k => {
                const isSel = selInf.includes(k);
                const item = rawData.inflows[k];
                const fullArr = [...item.fact, ...item.forecast.slice(0, 13)];
                html += `<tr class="${isSel ? 'bg-white' : 'opacity-40'} text-xs">
                    <td class="px-3 py-1.5 pl-6 text-slate-600">↳ ${k} (факт)</td>
                    ${fullArr.map(v => `<td class="px-2 py-1.5 text-right text-slate-500">${formatNum(v)}</td>`).join('')}
                </tr>`;
            });

            // Загальні видатки
            html += `<tr class="bg-purple-50 font-bold text-purple-900 border-t-2"><td class="px-3 py-2">ВИДАТКИ (ПЛАН)</td>${outPlan.map(v => `<td class="px-2 py-2 text-right">${formatNum(v)}</td>`).join('')}</tr>`;
            html += `<tr class="bg-red-50 font-bold text-red-900"><td class="px-3 py-2">ВИДАТКИ (ФАКТ / ПРОГНОЗ)</td>${outFact.map(v => `<td class="px-2 py-2 text-right">${formatNum(v)}</td>`).join('')}</tr>`;

            // Деталізація по вибраних видатках
            Object.keys(rawData.outflows).forEach(k => {
                const isSel = selOut.includes(k);
                const item = rawData.outflows[k];
                const fullArr = [...item.fact, ...item.forecast.slice(0, 13)];
                html += `<tr class="${isSel ? 'bg-white' : 'opacity-40'} text-xs">
                    <td class="px-3 py-1.5 pl-6 text-slate-600">↳ ${k} (факт)</td>
                    ${fullArr.map(v => `<td class="px-2 py-1.5 text-right text-slate-500">${formatNum(v)}</td>`).join('')}
                </tr>`;
            });

            // Чистий грошовий потік
            const netFlow = infFact.map((inf, idx) => inf - outFact[idx]);
            html += `<tr class="bg-slate-200 font-bold text-slate-900 border-t-2">
                <td class="px-3 py-2">ЧИСТИЙ ПОТІК (Факт)</td>
                ${netFlow.map(v => `<td class="px-2 py-2 text-right ${v >= 0 ? 'text-emerald-700' : 'text-red-700'}">${formatNum(v)}</td>`).join('')}
            </tr>`;

            document.getElementById('tableBodyRows').innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', updateChartAndTable);
    </script>
</body>
</html>
